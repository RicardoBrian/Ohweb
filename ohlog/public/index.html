<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수업일지 · 컴시간 조회 테스트</title>
<style>
  body{font:15px/1.5 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:16px;color:#1c1c1e;background:#f5f5f7}
  h1{font-size:20px} form,.row{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
  input,select{flex:1;min-width:120px;padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit;background:#fff}
  button{padding:10px 14px;border:0;border-radius:8px;background:#0071e3;color:#fff;font:inherit}
  .school{display:block;width:100%;text-align:left;margin:4px 0;background:#fff;color:inherit;border:1px solid #ddd}
  table{border-collapse:collapse;width:100%;background:#fff;border-radius:8px;overflow:hidden}
  th,td{border:1px solid #e5e5ea;padding:8px 4px;text-align:center;font-size:14px}
  th{background:#f0f0f5} td small,th small{display:block;color:#6e6e73;font-weight:400}
  td.chg{background:#fff4d6} pre{background:#fff;border-radius:8px;padding:12px;overflow:auto;white-space:pre-wrap;word-break:break-all;font-size:12px}
  .muted{color:#6e6e73}
</style>
</head>
<body>
<h1>컴시간 조회 테스트</h1>
<form id="f"><input id="q" placeholder="학교명 (예: 관산중학교)" required><button>검색</button></form>
<div id="list"></div>
<div class="row" id="pick" hidden>
  <select id="week"></select>
  <select id="teacher"></select>
</div>
<div id="grid"></div>
<pre id="out" class="muted">학교를 검색하세요.</pre>
<script>
const $ = (id) => document.getElementById(id);
const show = (o) => ($('out').textContent = typeof o === 'string' ? o : JSON.stringify(o, null, 2));
const api = (qs) => fetch('/api/comci?' + qs).then((r) => r.json());
let code = null;

$('f').onsubmit = async (e) => {
  e.preventDefault(); $('list').innerHTML = ''; $('pick').hidden = true; $('grid').innerHTML = ''; show('검색 중…');
  const d = await api('q=' + encodeURIComponent($('q').value.trim()));
  if (d.error) return show(d);
  show(d.schools.length ? '학교를 선택하세요.' : '검색 결과가 없습니다.');
  d.schools.forEach((s) => {
    const b = document.createElement('button');
    b.className = 'school'; b.textContent = `${s.region} ${s.name} (${s.sccode})`;
    b.onclick = () => load(s.sccode);
    $('list').appendChild(b);
  });
};

async function load(sccode) {
  code = sccode; show('시간표 불러오는 중…');
  const d = await api(`code=${code}&week=${$('week').value || 1}`);
  if (d.error) return show(d);
  const wk = $('week').value;
  $('week').innerHTML = (d.weeks || []).map(([n, label]) => `<option value="${n}">${label}</option>`).join('');
  $('week').value = wk || d.week;
  const cur = $('teacher').value;
  $('teacher').innerHTML = '<option value="">교사 선택</option>' + d.teachers.map((t) => `<option value="${t.id}">${t.name}</option>`).join('');
  $('teacher').value = cur;
  $('pick').hidden = false;
  show(`불러오기 성공 · 교사 ${d.teachers.length}명 · 과목 ${d.subjects.length - 1}개 · ${JSON.stringify(d.debug)}`);
  if (cur) render();
}
async function render() {
  const t = $('teacher').value; if (!t) return ($('grid').innerHTML = '');
  const d = await api(`code=${code}&week=${$('week').value}&teacher=${t}`);
  if (d.error) return show(d);
  const days = ['월', '화', '수', '목', '금'];
  const max = Math.max(7, ...d.lessons.map((l) => l.period));
  let h = '<table><tr><th></th>' + days.map((x) => `<th>${x}</th>`).join('') + '</tr>';
  for (let p = 1; p <= max; p++) {
    h += `<tr><th>${p}${d.times?.[p - 1] ? `<small>${String(d.times[p - 1]).replace(/^\s*\d+\s*/, '')}</small>` : ''}</th>`;
    for (let day = 1; day <= 5; day++) {
      const ls = d.lessons.filter((l) => l.day === day && l.period === p);
      h += `<td class="${ls.some((l) => l.changed) ? 'chg' : ''}">` + ls.map((l) => `${l.grade}-${l.class}<small>${l.subjectName}${l.room ? ' · ' + l.room : ''}</small>`).join('') + '</td>';
    }
    h += '</tr>';
  }
  $('grid').innerHTML = h + '</table>';
}
$('teacher').onchange = render;
$('week').onchange = () => load(code);
</script>
</body>
</html>
