<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가림고 해커톤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
  /* 설정은 아래 script 의 START / END / EMAIL. 1920×1080 프로젝터 기준으로 vw·vh 로 맞춤 */
  :root {
    --bg1: #070b1f; --bg2: #141a3a;
    --yellow: #f5cf3b; --yellow-ink: #1c1c1c;
    --text: #f4f5fb; --muted: #aab0cf;
    --red: #ff5a4f;
    --pad: 2.6vw;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Gowun Dodum", "Malgun Gothic", sans-serif;
    background: radial-gradient(ellipse at 50% 120%, var(--bg2), var(--bg1) 70%);
    color: var(--text);
    overflow: hidden;
  }
  #sky { position: fixed; inset: 0; z-index: 0; }

  /* 위: 주제 / 가운데: 시계 / 아래: 진행률·안내 */
  main {
    position: relative; z-index: 1;
    height: 100%;
    display: grid; grid-template-rows: auto 1fr auto;
    gap: 2vh;
    padding: 3vh var(--pad);
  }

  .topic h1, .status, .clock, .tags span, .topic .label, .deadline strong {
    font-family: "Black Han Sans", "Malgun Gothic", sans-serif; font-weight: 400;
  }

  /* 주제 카드: 왼쪽 제목, 오른쪽 설명·태그 */
  .topic {
    background: var(--yellow); color: var(--yellow-ink);
    border-radius: 1.2vw;
    padding: 2.6vh 2.4vw;
    display: grid; grid-template-columns: 1.1fr 1fr; gap: 1vh 3vw; align-items: center;
    box-shadow: 0 2vh 6vh rgba(0,0,0,.45);
  }
  .topic .label { grid-column: 1 / -1; font-size: min(1.25vw, 2.3vh); opacity: .75; letter-spacing: .05em; }
  .topic h1 { line-height: 1.15; letter-spacing: -.01em; font-size: min(3.5vw, 6.4vh); }
  .topic p { font-size: min(1.3vw, 2.4vh); line-height: 1.6; }
  .topic p b { color: #c4170c; }
  .tags { display: flex; flex-wrap: wrap; gap: .6vw; margin-top: 1.4vh; }
  .tags span {
    background: #1d2033; color: #fff;
    border-radius: 999px; padding: .3em .95em;
    font-size: min(1.1vw, 2vh);
  }
  .tags span.etc { background: transparent; color: var(--yellow-ink); border: 2px solid #1d2033; }

  /* 시계 */
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; }
  .status { font-size: min(2.6vw, 4.6vh); letter-spacing: .04em; }
  .clock {
    font-size: min(21.5vw, 40vh);
    white-space: nowrap; line-height: 1; cursor: pointer;
    color: var(--yellow);
    text-shadow: 0 0 .15em rgba(245,207,59,.35);
    transition: color .3s;
  }
  .clock .d { display: inline-block; width: .6em; text-align: center; }
  .clock .sep { display: inline-block; width: .3em; text-align: center; opacity: .55; }
  body.urgent .clock { color: var(--red); text-shadow: 0 0 .15em rgba(255,90,79,.5); }
  body.urgent.blink .clock { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  body.done .clock { color: var(--red); }

  /* 아래 */
  .bottom { display: grid; gap: 1.6vh; }
  .bar { height: 1.2vh; background: rgba(255,255,255,.12); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--yellow); border-radius: 99px; transition: width 1s linear; }
  body.urgent .bar i { background: var(--red); }
  .info { display: flex; justify-content: space-between; align-items: center; gap: 2vw; font-size: min(1.8vw, 3.3vh); }
  .deadline { color: var(--muted); }
  .deadline strong { color: var(--yellow); }
  .email { font-weight: 700; }
  .email span { color: var(--yellow); }
  .tools { display: flex; gap: 1vw; align-items: center; color: var(--muted); font-size: min(1.1vw, 2vh); white-space: nowrap; }
  .tools button {
    background: rgba(255,255,255,.08); color: var(--muted); border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px; padding: .4em .8em; font: inherit; cursor: pointer;
  }
  .tools button:hover { color: #fff; }

  /* 전체화면 모드: 주제는 한 줄로 줄이고 시계를 최대로. 정보는 모두 남긴다 */
  body.big .topic { grid-template-columns: auto 1fr; padding: 1.6vh 2vw; }
  body.big .topic .label, body.big .topic p span.desc { display: none; }
  body.big .topic h1 { font-size: min(2.4vw, 4.4vh); }
  body.big .topic h1 br { display: none; }
  body.big .tags { margin-top: 0; justify-content: flex-end; }
  body.big .clock { font-size: min(22.5vw, 56vh); }
  body.big .info { font-size: min(2vw, 3.7vh); }
  body.big .tools button { display: none; }

  @media (max-width: 800px) {
    body { overflow: auto; }
    main { height: auto; min-height: 100%; }
    .topic { grid-template-columns: 1fr; }
    .topic h1 { font-size: 7vw; } .topic p, .tags span { font-size: 3.6vw; }
    .info { flex-direction: column; font-size: 4.2vw; text-align: center; }
    .tools { font-size: 3.4vw; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<main>
  <section class="topic">
    <div class="label">가림고 해커톤 · 주제 공개</div>
    <h1>우리 학교의 문제를<br> 바이브코딩으로 해결하라</h1>
    <p><span class="desc">우리 학교에는 <b>급식 질서, 교복, 흡연</b> 등 다양한 학교생활 문제가 있습니다.
       이런 문제를 해결하거나 예방할 수 있는 작품(웹 · 앱 · 게임)을 만들어 보세요.</span>
      <span class="tags">
        <span>급식 질서</span><span>교복</span><span>흡연</span><span>분실물</span><span>공공기물</span><span class="etc">그 밖의 학교생활 문제</span>
      </span>
    </p>
  </section>

  <section class="center">
    <div class="status" id="status">마감까지 남은 시간</div>
    <div class="clock" id="clock" title="클릭하면 전체화면">--:--:--</div>
  </section>

  <section class="bottom">
    <div class="bar"><i id="bar"></i></div>
    <div class="info">
      <div class="deadline" id="sub"><strong id="endText">22:00</strong>까지 산출물과 발표 자료를 모두 완성하세요</div>
      <div class="email">제출 이메일 : <span id="email"></span></div>
      <div class="tools"><span id="now"></span><button id="fs" type="button">전체화면 (F)</button></div>
    </div>
  </section>
</main>

<script>
  // ── 설정: 한국 시간(+09:00) 기준 ──
  const START = new Date('2026-11-12T18:00:00+09:00');   // 진행률 막대 시작점
  const END   = new Date('2026-11-12T22:00:00+09:00');   // 마감
  const EMAIL = 'jack610963@gmail.com';
  const URGENT_MIN = 10;   // 남은 시간이 이보다 적으면 빨간색
  const BLINK_MIN  = 1;    // 남은 시간이 이보다 적으면 깜빡임

  const $ = id => document.getElementById(id);
  // 숫자마다 폭을 고정해 초가 바뀔 때 글자가 흔들리지 않게
  const pad = n => [...String(n).padStart(2, '0')].map(c => `<span class="d">${c}</span>`).join('');
  const hm = d => d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Seoul' });

  $('email').textContent = EMAIL;
  $('endText').textContent = hm(END);

  function tick() {
    const now = Date.now();
    const left = END - now;
    $('now').textContent = '현재 ' + new Date(now).toLocaleTimeString('ko-KR', { hour12: false, timeZone: 'Asia/Seoul' });

    if (left <= 0) {
      document.body.className = big ? 'done big' : 'done';
      $('status').textContent = '시간 종료!';
      $('clock').innerHTML = `${pad(0)}<span class="sep">:</span>${pad(0)}<span class="sep">:</span>${pad(0)}`;
      $('sub').innerHTML = '<strong>손을 멈추고</strong> 작품과 발표 자료를 제출하세요';
      $('bar').style.width = '100%';
      return;
    }
    const s = Math.ceil(left / 1000);
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    $('clock').innerHTML = `${pad(h)}<span class="sep">:</span>${pad(m)}<span class="sep">:</span>${pad(sec)}`;

    const cls = big ? ['big'] : [];
    if (left <= URGENT_MIN * 60000) cls.push('urgent');
    if (left <= BLINK_MIN * 60000) cls.push('blink');
    document.body.className = cls.join(' ');
    $('status').textContent = left <= URGENT_MIN * 60000 ? '마감 임박!' : '마감까지 남은 시간';

    const p = Math.min(1, Math.max(0, (now - START) / (END - START)));
    $('bar').style.width = (p * 100).toFixed(2) + '%';
  }
  // 전체화면 모드: 버튼·F 키·시계 클릭. Esc 로 나오면 원래 화면으로
  let big = false;
  function setBig(on) {
    big = on;
    tick();
    if (on && !document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
    if (!on && document.fullscreenElement) document.exitFullscreen();
  }
  $('fs').onclick = () => setBig(!big);
  $('clock').onclick = () => setBig(!big);
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F' || e.key === 'ㄹ') setBig(!big); });
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && big) setBig(false); });

  tick();
  setInterval(tick, 250);

  // 화면 꺼짐 방지
  let lock = null;
  async function keepAwake() { try { lock = await navigator.wakeLock?.request('screen'); } catch (e) {} }
  keepAwake();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

  // ── 별 + 별똥별 배경 ──
  const cv = $('sky'), ctx = cv.getContext('2d');
  let W, H, stars = [], meteors = [];
  function resize() {
    const r = devicePixelRatio || 1;
    W = innerWidth; H = innerHeight;
    cv.width = W * r; cv.height = H * r; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(r, 0, 0, r, 0, 0);
    stars = Array.from({ length: Math.round(W * H / 9000) }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + .3, t: Math.random() * 6.28, v: Math.random() * .02 + .005
    }));
  }
  addEventListener('resize', resize); resize();
  function spawn() {
    meteors.push({ x: Math.random() * W * .8 + W * .2, y: Math.random() * H * .4, vx: -(6 + Math.random() * 5), vy: 3 + Math.random() * 3, life: 1 });
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      s.t += s.v;
      ctx.globalAlpha = .45 + Math.sin(s.t) * .4;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
    }
    if (Math.random() < .008) spawn();
    for (const m of meteors) {
      m.x += m.vx; m.y += m.vy; m.life -= .012;
      const g = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 22, m.y - m.vy * 22);
      g.addColorStop(0, `rgba(255,255,255,${m.life})`); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalAlpha = 1; ctx.strokeStyle = g; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.vx * 22, m.y - m.vy * 22); ctx.stroke();
    }
    meteors = meteors.filter(m => m.life > 0);
    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
