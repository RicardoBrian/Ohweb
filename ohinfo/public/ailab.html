<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 실험실 — OHinfo</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="ai-themes.css?v=202610060655">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); background-attachment: fixed; line-height: 1.55; color: var(--text); font-family: var(--font); }
    .hidden { display: none !important; }
    button { font-family: inherit; }

    /* 상단 메뉴 */
    .nav { position: sticky; top: 0; z-index: 200; display: flex; align-items: center; gap: 10px; padding: 0 18px; height: var(--nav-h); }
    .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); min-width: 0; }
    .nav-brand img { height: 30px; width: auto; display: block; }
    .nav-brand span { font-weight: 700; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .nav-name { font-size: .85rem; color: var(--text-2); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .icon-round { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border-card); background: var(--glass); color: var(--sub); cursor: pointer; display: grid; place-items: center; font-size: 15px; }
    .lang { position: relative; }
    .lang-dd { position: absolute; right: 0; top: calc(100% + 8px); background: var(--glass-strong); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--border-card); border-radius: var(--radius-sm); box-shadow: var(--shadow-md); overflow: hidden; min-width: 110px; }
    .lang-item { display: block; width: 100%; text-align: left; padding: 10px 14px; font-size: .85rem; font-weight: 600; background: none; border: 0; color: var(--text); cursor: pointer; }
    .lang-item:hover { background: var(--accent-light); }
    .lang-item.on::after { content: ' ✓'; color: var(--accent); }
    @media (max-width: 560px) { .nav { padding: 0 12px; } .nav-name { display: none; } .nav-brand img { display: none; } }

    .wrap { max-width: 1040px; margin: 0 auto; padding: 22px 18px 120px; }
    .btn.primary { background: var(--accent-grad); color: #fff; border-color: transparent; }
    .btn.primary:hover { filter: brightness(1.06); background: var(--accent-grad); }
    .muted { color: var(--text-2); font-size: .88rem; }
    .err { color: var(--danger); font-size: .9rem; margin: 6px 0; }
    .err:empty { display: none; }
    .err.sm { font-size: .8rem; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .row input { flex: 1 1 220px; }
    input:not([type]), input[type="text"], select, textarea {
      font: inherit; color: var(--text); background: var(--glass-strong); border: 1px solid var(--border-card);
      border-radius: var(--radius-sm); padding: 10px 12px; outline: none; width: 100%; box-shadow: var(--highlight);
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-light); }
    input:disabled { opacity: .6; }
    textarea { resize: vertical; min-height: 64px; }
    .card { padding: 18px; margin: 14px 0; border-radius: var(--radius); }
    .card h3 { margin: 0 0 10px; font-size: 1.02rem; }
    .card h4 { margin: 16px 0 8px; font-size: .95rem; }
    .field { margin-bottom: 14px; }
    .field > label, .card > label { display: block; font-weight: 700; font-size: .9rem; margin: 0 0 6px; }
    .lead { font-size: 1.05rem; font-weight: 600; margin: 16px 2px 8px; }
    .note { background: var(--accent-light); border-radius: var(--radius-sm); padding: 10px 14px; margin: 10px 0; font-size: .9rem; }
    .note.warn { background: rgba(255,159,10,.14); }
    .note.ok { background: var(--success-light); }
    .tips { background: var(--glass); border: 1px solid var(--border-card); border-radius: var(--radius-sm); padding: 10px 14px; font-size: .88rem; }
    .tips ul { margin: 4px 0 0; padding-left: 18px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 720px) { .two { grid-template-columns: 1fr; } }
    .howto { background: var(--glass-strong); border: 1px solid var(--border-card); border-radius: var(--radius-sm); padding: 10px 14px; font-size: .88rem; }
    .howto ol { margin: 4px 0; padding-left: 20px; }
    .howto p { margin: 4px 0 0; color: var(--text-2); }
    .spin { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--hairline); border-top-color: var(--accent); animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty { text-align: center; padding: 80px 20px; }
    .empty-ic { font-size: 44px; }
    .empty h2 { margin: 10px 0 6px; }
    .empty p { color: var(--text-2); margin: 0; }
    .choose { display: flex; flex-direction: column; gap: 8px; max-width: 320px; margin: 20px auto 0; }

    /* 머리: 모둠 + 탭 */
    .lab-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
    .lab-pair { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .pair-no { font-weight: 800; font-size: 1.1rem; margin-right: 4px; }
    .mem { padding: 4px 10px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--border-card); font-size: .85rem; }
    .mem.me { border-color: var(--accent); }
    .mem em { font-style: normal; font-size: .72rem; color: #fff; background: var(--accent); border-radius: 999px; padding: 1px 7px; margin-left: 2px; }
    .round { font-size: .8rem; color: var(--text-2); margin-left: 4px; }
    .seg { display: inline-flex; background: var(--glass); border: 1px solid var(--border-card); border-radius: 999px; padding: 3px; gap: 2px; }
    .seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: .88rem; color: var(--text-2); cursor: pointer; }
    .seg button.on { background: var(--bg-elevated); color: var(--text); box-shadow: var(--shadow-sm); }
    .seg.sub { margin: 8px 0 4px; flex-wrap: wrap; border-radius: 16px; }

    /* 단계 지도 */
    .stepper { list-style: none; padding: 0; margin: 18px 0 6px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; position: relative; }
    .stepper button { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: var(--radius-sm); border: 1px solid var(--border-card); background: var(--glass); cursor: pointer; color: var(--text); }
    .stepper .sn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--glass-strong); border: 1.5px solid var(--hairline); }
    .stepper .st { font-size: .8rem; font-weight: 600; text-align: center; line-height: 1.2; }
    .stepper .done .sn { background: var(--success); color: #fff; border-color: transparent; }
    .stepper .cur { border-color: var(--accent); background: var(--accent-light); }
    .stepper .cur .sn { background: var(--accent); color: #fff; border-color: transparent; }
    .stepper .lock { opacity: .45; cursor: not-allowed; }
    @media (max-width: 520px) { .stepper .st { font-size: .7rem; } .stepper .sn { width: 26px; height: 26px; } }
    .banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--success-light); border-radius: var(--radius-sm); padding: 10px 14px; margin: 10px 0; font-size: .92rem; }
    .banner .x { margin-left: auto; border: 0; background: none; font-size: 20px; cursor: pointer; color: var(--text-2); }
    .next { display: flex; justify-content: flex-end; margin: 18px 0; }
    .next.two-btn { justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }

    /* ① */
    .label-rows { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .label-row { display: grid; grid-template-columns: 26px 1fr 36px; gap: 8px; align-items: center; }
    .owner-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 4px 34px; font-size: .8rem; }
    .ochips { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 6px; }
    .ochip { border: 1px solid var(--border-card); background: var(--glass); color: var(--text-2); border-radius: 999px; padding: 3px 10px; font-size: .78rem; cursor: pointer; }
    .ochip.on { background: var(--accent); color: #fff; border-color: transparent; }
    .label-row .ln { font-weight: 800; color: var(--text-2); text-align: center; }
    @media (max-width: 520px) { .label-row { grid-template-columns: 22px 1fr 32px; } .owner-line { margin-left: 30px; } }
    .icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border-card); background: var(--glass); cursor: pointer; font-size: 18px; color: var(--text-2); }
    .icon-btn:disabled { opacity: .3; cursor: not-allowed; }
    .tr-line { display: flex; flex-wrap: wrap; gap: 8px; font-size: .75rem; color: var(--text-3); margin: -2px 0 4px 34px; }
    .ro { padding: 8px 12px; background: var(--glass); border-radius: var(--radius-sm); }
    .ro-labels { display: flex; flex-direction: column; gap: 6px; }
    .ro-label { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; background: var(--glass); border-radius: var(--radius-sm); }
    .ro-label .tr-line { margin: 0; flex-basis: 100%; }
    .tag { font-size: .75rem; padding: 2px 9px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--border-card); color: var(--text-2); white-space: nowrap; }
    .tag.me { background: var(--accent); color: #fff; border-color: transparent; }

    /* ② ③ 사진 칸 */
    .lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 12px; }
    .lcard { background: var(--surface); border: 1px solid var(--border-card); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow-sm); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); min-width: 0; }
    .lcard.mine { border-color: var(--accent); }
    .lcard[data-dropzone] { transition: box-shadow .15s, transform .15s; }
    .lcard[data-dropzone].active { box-shadow: 0 0 0 3px var(--accent-light), var(--shadow-sm); }
    .lcard[data-dropzone].drag { box-shadow: 0 0 0 4px var(--accent), var(--shadow-md); transform: scale(1.01); }
    .lcard[data-dropzone].drag .dz { border-style: solid; border-color: var(--accent); background: var(--accent-light); }
    .lc-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .lc-head b { font-size: 1.05rem; overflow-wrap: anywhere; }
    .owner-sel { width: auto; padding: 4px 8px; font-size: .8rem; }
    .prog { display: flex; align-items: center; gap: 8px; }
    .bar { flex: 1; height: 9px; border-radius: 999px; background: var(--hairline); overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--accent-grad); border-radius: inherit; transition: width .5s; }
    .cnt { font-size: .82rem; font-variant-numeric: tabular-nums; color: var(--text-2); white-space: nowrap; }
    .cnt.ok { color: var(--success); font-weight: 700; }
    .lc-state { font-size: .8rem; color: var(--text-2); margin: 4px 0 8px; }
    .lc-state.ok { color: var(--success); font-weight: 700; }
    .dz { border: 2px dashed var(--border-card); border-radius: var(--radius-sm); padding: 14px; text-align: center; font-size: .84rem; color: var(--text-2); cursor: pointer; display: flex; flex-direction: column; gap: 8px; align-items: center; background: var(--glass); outline: none; transition: .15s; }
    .dz.active, .dz:focus { border-color: var(--accent); background: var(--accent-light); color: var(--text); }
    .dz.drag { border-style: solid; border-color: var(--accent); transform: scale(1.01); }
    .not-mine { font-size: .82rem; color: var(--text-3); padding: 8px 0; }
    .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 6px; margin-top: 10px; }
    .ph { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--hairline); }
    .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ph.pend img { opacity: .5; }
    .ph.small { outline: 2px solid #ffb54d; outline-offset: -2px; }
    .ph-small { position: absolute; left: 2px; bottom: 2px; font-size: 10px; font-weight: 700; background: #ffb54d; color: #4a2a00; border-radius: 4px; padding: 0 4px; }
    .warn-txt { color: #b26b00; font-weight: 600; }
    body.dark .warn-txt { color: #ffc46b; }
    .ph-spin { position: absolute; inset: 0; margin: auto; width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); border-top-color: var(--accent); animation: spin .8s linear infinite; }
    .ph-x { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; line-height: 1; cursor: pointer; opacity: 0; transition: .15s; }
    .ph:hover .ph-x, .ph-x:focus { opacity: 1; }
    @media (hover: none) { .ph-x { opacity: .85; } }
    .savebar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 300; background: var(--bg-elevated); border: 1px solid var(--border-card); box-shadow: var(--shadow-md); border-radius: 999px; padding: 10px 18px; font-size: .88rem; max-width: calc(100vw - 32px); }
    .savebar.warn { background: #fff4e0; color: #8a4b00; }
    body.dark .savebar.warn { background: #3a2a10; color: #ffcf8a; }

    /* ③ */
    .guide { padding-left: 22px; margin: 0 0 10px; }
    .guide li { margin: 4px 0; }
    .labels-inline { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }
    code { background: var(--glass-strong); border: 1px solid var(--border-card); border-radius: 6px; padding: 1px 7px; font-size: .85rem; font-family: inherit; }
    .linked { font-weight: 600; margin-bottom: 8px; }
    .linked .muted { font-weight: 400; overflow-wrap: anywhere; margin-top: 4px; }
    .mapping { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
    .map-row { display: grid; grid-template-columns: minmax(80px, 160px) 20px minmax(140px, 220px) 1fr; gap: 8px; align-items: center; }
    @media (max-width: 560px) { .map-row { grid-template-columns: 1fr 16px 1fr; } .map-row .err { grid-column: 1 / -1; } }

    /* ③ 학습 */
    .tdata { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
    .trow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 6px 10px; background: var(--glass); border-radius: var(--radius-sm); }
    .trow b { min-width: 90px; }
    .params { display: flex; flex-direction: column; gap: 6px; }
    .param { background: var(--glass); border-radius: var(--radius-sm); padding: 8px 12px; }
    .param summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
    .param summary::-webkit-details-marker { display: none; }
    .param .info { margin-left: auto; color: var(--accent); font-weight: 700; }
    .param p { margin: 6px 0 2px; font-size: .88rem; color: var(--text-2); }
    .btn.big { padding: 14px 26px; font-size: 1.05rem; }
    .train-box { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
    .tprog { width: 100%; display: flex; flex-direction: column; gap: 6px; }
    .tprog .bar { height: 12px; }
    .mlist { display: flex; flex-direction: column; gap: 4px; width: 100%; }
    .mitem { padding: 6px 10px; border-radius: var(--radius-sm); background: var(--glass); font-size: .9rem; }
    .mitem.cur { border: 1.5px solid var(--accent); }
    .muted.sm { font-size: .8rem; }
    .deploy-model { margin-bottom: 8px; }

    /* ④ */
    .eval-top { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
    .history { font-size: .88rem; }
    .hchip { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--accent-light); font-size: .8rem; font-weight: 600; }
    .score { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .score .big { font-size: 2.4rem; font-weight: 800; line-height: 1; }
    .ebars { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
    .erow { display: grid; grid-template-columns: minmax(70px, 30%) 1fr 48px; gap: 8px; align-items: center; font-size: .88rem; }
    .erow > span:first-child { overflow-wrap: anywhere; }
    .wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .wcard { background: var(--glass); border: 1px solid var(--border-card); border-radius: var(--radius-sm); padding: 8px; font-size: .82rem; }
    .wcard img, .ph-gone { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; display: grid; place-items: center; background: var(--hairline); margin-bottom: 4px; }
    .bad { color: var(--danger); }
    .ok-msg { color: var(--success); font-weight: 700; }
    .stars { display: flex; gap: 4px; margin: 4px 0 10px; }
    .star { font-size: 30px; border: 0; background: none; color: var(--hairline); cursor: pointer; padding: 0 2px; line-height: 1; -webkit-text-stroke: 1px var(--text-3); }
    .star.on { color: #ffb800; -webkit-text-stroke: 0; }
    .stars-ro { color: #ffb800; letter-spacing: 1px; }
    .peer { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--hairline); font-size: .9rem; }
    .checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; margin-bottom: 10px; }
    .check, .radio { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: var(--radius-sm); background: var(--glass); cursor: pointer; font-size: .9rem; }
    .check input, .radio input { width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }
    .typing { display: inline-block; font-size: .78rem; color: var(--accent); margin-bottom: 4px; }
    details.card summary { cursor: pointer; }
    details.card .dz { margin-top: 10px; }
    .try-res { display: flex; gap: 12px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .try-res img { width: 120px; height: 120px; object-fit: cover; border-radius: 10px; }

    /* ⑤ */
    .deploy { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); gap: 16px; align-items: start; }
    @media (max-width: 880px) { .deploy { grid-template-columns: 1fr; } }
    .deploy-preview { position: sticky; top: calc(var(--nav-h) + 12px); }
    .pv-label { font-weight: 700; font-size: .9rem; margin: 14px 0 6px; }
    .pv-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .pv-tabs button { border: 1px solid var(--border-card); background: var(--glass); border-radius: 999px; padding: 4px 10px; font-size: .8rem; cursor: pointer; color: var(--text); }
    .pv-tabs button.on { background: var(--accent); color: #fff; border-color: transparent; }
    .pv-frame { border-radius: 22px; overflow: hidden; border: 1px solid var(--border-card); box-shadow: var(--shadow-md); max-height: 640px; overflow-y: auto; }
    .pv-frame .ai-app { min-height: 0; pointer-events: none; }
    .pv-frame .aa-wrap { padding: 24px 14px 16px; }
    .pv-frame .aa-drop { min-height: 150px; }
    .pv-frame .aa-photo { max-height: 160px; }
    .themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
    .theme-card { display: flex; flex-direction: column; gap: 6px; align-items: center; padding: 8px; border-radius: var(--radius-sm); border: 2px solid var(--border-card); background: var(--glass); cursor: pointer; font-weight: 600; font-size: .82rem; color: var(--text); }
    .theme-card.on { border-color: var(--accent); background: var(--accent-light); }
    .sw { width: 100%; height: 46px; border-radius: 8px; display: block; }
    .sw-minimal { background: linear-gradient(#fafafa 0 60%, #fff 60%); border: 1px solid #e4e4e7; box-shadow: inset 0 -8px 0 #2563eb33; }
    .sw-bw { background: repeating-linear-gradient(90deg, #000 0 10px, #fff 10px 20px); border: 3px solid #000; }
    .sw-glass { background: linear-gradient(140deg, #c7d2fe, #fbcfe8 50%, #bae6fd); box-shadow: inset 0 0 0 6px rgba(255,255,255,.45); }
    .sw-neon { background: radial-gradient(circle at 30% 40%, #00f0ff 0 6px, transparent 14px), radial-gradient(circle at 70% 60%, #ff2bd6 0 6px, transparent 14px), #05050c; }
    .sw-warm { background: linear-gradient(135deg, #f8efe2, #f3c9a0); border: 1px solid #efdcc6; }
    .al { padding: 12px 0; border-top: 1px solid var(--hairline); }
    .al:first-of-type { border-top: 0; }
    .al-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .emojis { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 8px; }
    .em { width: 34px; height: 34px; border-radius: 8px; border: 1px solid transparent; background: var(--glass); font-size: 18px; cursor: pointer; }
    .em.on { border-color: var(--accent); background: var(--accent-light); }
    .phrases { display: flex; flex-direction: column; gap: 4px; }
    .radio.custom { flex-wrap: wrap; }
    .cust { display: inline-flex; align-items: center; gap: 2px; flex: 1 1 220px; min-width: 0; }
    .cust input { padding: 6px 8px; flex: 1 1 auto; width: auto; min-width: 140px; }
    .url-box { margin: 14px 0; }
    .url-box label { font-weight: 700; font-size: .9rem; display: block; margin-bottom: 6px; }

    /* 현황판 */
    .board-title { margin: 18px 0 10px; font-size: 1.2rem; }
    .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
