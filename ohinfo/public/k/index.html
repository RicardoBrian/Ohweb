<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kaká</title>
<link rel="icon" href="/kaka/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/kaka/kaka.css?v=1128">
<style>
  .k-header { position: sticky; top: 0; z-index: 10; }
  .lang { position: relative; }
  .k-nav a, .lang > button { white-space: nowrap; }
  .lang .k-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; }
  .page { padding: var(--space-6) var(--space-5) var(--space-7); max-width: var(--reading-w); box-sizing: border-box; }
  .page__head { display: grid; gap: 4px; margin-bottom: var(--space-6); }
  .pn { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-7); padding-top: var(--space-5); border-top: 1px solid var(--line); }
  .unit-name { font: 500 14px/20px var(--font-sans); color: var(--ink-2); margin: var(--space-4) 0 var(--space-1); }
  .course { margin-bottom: var(--space-7); }
  .k-lesson__title { font-size: 17px; }
  .k-avatar { width: auto; min-width: 32px; padding: 0 10px; border-radius: 999px; box-sizing: border-box; }
  a.k-btn { text-decoration: none; }
  /* 넓은 화면: 왼쪽에 내 차시 목록, 가운데 본문(읽기 폭 그대로) */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .page--wide { max-width: var(--content-w); }
  @media (min-width: 1100px) {
    .layout { grid-template-columns: 240px minmax(0, var(--reading-w)); column-gap: var(--space-7); justify-content: center; padding: 0 var(--space-5); }
    .layout > .page { padding-left: 0; padding-right: 0; }
    .side { display: block; position: sticky; top: var(--header-h); align-self: start; max-height: calc(100vh - var(--header-h)); overflow: auto; padding: var(--space-6) 0; box-sizing: border-box; }
  }
  .side__course { font: 600 15px/22px var(--font-sans); margin: 0 0 var(--space-1); }
  .side__unit { font: 500 13px/18px var(--font-sans); color: var(--ink-3); margin: var(--space-3) 0 2px; }
  .side ol { list-style: none; margin: 0; padding: 0; }
  .side a { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; padding: 5px 8px; margin: 0 -8px; border-radius: var(--radius-sm); color: var(--ink-2); text-decoration: none; font: 400 14px/20px var(--font-sans); }
  .side a:hover { background: var(--surface-2); color: var(--ink); }
  .side a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .side .no { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  @media (max-width: 600px) { .k-header { gap: var(--space-3); padding: 0 var(--space-4); } .page { padding: var(--space-5) var(--space-4) var(--space-7); } .k-nav a { padding: 8px 6px; } }
</style>
</head>
<body>
<div class="sk-head" aria-hidden="true"><span class="sk" style="width:92px;height:22px"></span><span class="sk" style="width:120px;height:16px"></span></div>
<main class="page" aria-busy="true"><div class="page__head"><span class="sk" style="width:180px;height:14px"></span><span class="sk" style="width:260px;height:32px;margin-top:6px"></span></div>
<span class="sk sk-line" style="width:90%"></span><span class="sk sk-line" style="width:96%"></span><span class="sk sk-line" style="width:70%"></span><span class="sk sk-line" style="width:84%;margin-top:28px"></span><span class="sk sk-line" style="width:60%"></span></main>
<script type="module">
import { session, api, getLang, setLang, esc, nameIn, stuNo, logout } from '/k/stu.js?v=1128';
import { LOGO_SVG } from '/kaka/logo.js?v=1128';
import { LANGS, fsDecode, localized, renderBlocks, DOC_CSS } from '/kaka/render.js?v=1128';

document.head.insertAdjacentHTML('beforeend', `<style>${DOC_CSS}</style>`);

// 화면 글(네 언어). 짧고 번역하기 쉽게.
const T = {
  ko: { today: '오늘 차시', list: '내 과목', no: n => `${n}차시`, none: '아직 열린 차시가 없습니다.', noneSub: '선생님이 차시를 열면 여기에 보입니다.', empty: '선생님이 아직 내용을 넣지 않았습니다.', closed: '열 수 없는 차시입니다.', fail: '불러오지 못했습니다. 새로고침하세요.', prev: '이전 차시', next: '다음 차시', lang: '언어', logout: '로그아웃', now: '지금', open: '열기' },
  zh: { today: '今天的课', list: '我的科目', no: n => `第${n}课时`, none: '还没有开放的课时。', noneSub: '老师开放课时后会显示在这里。', empty: '老师还没有添加内容。', closed: '无法打开这个课时。', fail: '加载失败。请刷新页面。', prev: '上一课时', next: '下一课时', lang: '语言', logout: '退出', now: '现在', open: '打开' },
  ru: { today: 'Урок сегодня', list: 'Мои предметы', no: n => `Урок ${n}`, none: 'Открытых уроков пока нет.', noneSub: 'Когда учитель откроет урок, он появится здесь.', empty: 'Учитель ещё не добавил материал.', closed: 'Этот урок нельзя открыть.', fail: 'Не удалось загрузить. Обновите страницу.', prev: 'Предыдущий урок', next: 'Следующий урок', lang: 'Язык', logout: 'Выйти', now: 'Сейчас', open: 'Открыть' },
  en: { today: "Today's lesson", list: 'My subjects', no: n => `Lesson ${n}`, none: 'No lessons are open yet.', noneSub: 'When your teacher opens a lesson, it appears here.', empty: 'Your teacher has not added content yet.', closed: 'This lesson cannot be opened.', fail: 'Could not load. Please refresh.', prev: 'Previous lesson', next: 'Next lesson', lang: 'Language', logout: 'Log out', now: 'Now', open: 'Open' },
};
let lang = getLang(T);
const t = () => T[lang];
const nm = o => nameIn(o, lang);

let today = null, view = null, menuOpen = false;
const docCache = {};

function header() {
  const route = location.hash.startsWith('#list') ? 'list' : 'today';
  return `<header class="k-header"><a class="k-logo" href="#" aria-label="kaká">${LOGO_SVG}</a>
    <nav class="k-nav"><a href="#" ${route === 'today' ? 'aria-current="page"' : ''}>${esc(t().today)}</a><a href="#list" ${route === 'list' ? 'aria-current="page"' : ''}>${esc(t().list)}</a></nav>
    <div class="k-header__end"><div class="lang"><button class="k-select" id="lang-btn" aria-haspopup="menu" aria-expanded="${menuOpen}" aria-label="${esc(t().lang)}">${esc(LANGS.find(l => l[0] === lang)[1])}</button>
      ${menuOpen ? `<div class="k-menu" role="menu">${LANGS.map(([k, n]) => `<button role="menuitemradio" aria-checked="${k === lang}" data-lang="${k}"><span>${n}</span></button>`).join('')}<button role="menuitem" id="logout"><span>${esc(t().logout)}</span></button></div>` : ''}</div>
    <span class="k-avatar" title="${esc(session.name || '')}">${esc(stuNo(session))}</span></div></header>`;
}
const paint = main => { document.body.innerHTML = header() + main; document.documentElement.lang = lang; };
const msg = (title, sub = '') => `<main class="page"><div class="k-callout"><span class="k-callout__label">${esc(title)}</span>${sub ? `<span>${esc(sub)}</span>` : ''}</div></main>`;

// 공개된 차시를 과목 순서대로 한 줄로
// 넓은 화면 왼쪽 목록(좁은 화면에서는 숨김 — [내 과목]이 같은 일을 한다)
const side = cur => `<aside class="side" aria-label="${esc(t().list)}">${(today?.courses || []).filter(c => c.lessons.length).map(c => `<p class="side__course">${esc(nm(c))}</p>
  ${c.units.filter(u => c.lessons.some(l => l.unitId === u.id)).map(u => `<p class="side__unit">${esc(nm(u))}</p><ol>${c.lessons.filter(l => l.unitId === u.id).map(l => `<li><a href="#lesson=${l.id}"${l.id === cur ? ' aria-current="page"' : ''}><span class="no">${l.no}</span><span>${esc(nm(l))}</span></a></li>`).join('')}</ol>`).join('')}`).join('<div style="height:var(--space-5)"></div>')}</aside>`;
const flat = () => (today?.courses || []).flatMap(c => c.lessons.map(l => ({ ...l, course: c })));

async function showLesson(id) {
  if (!id) return paint(msg(t().none, t().noneSub));
  if (!docCache[id]) {
    const d = await api('doc', { lessonId: id });
    if (d.error) return paint(msg(d.closed ? t().closed : t().fail));
    d.doc = fsDecode(d.doc); docCache[id] = d;
  }
  const { course, lesson, doc } = docCache[id];
  const unit = course.units.find(u => u.id === lesson.unitId);
  const list = flat(), i = list.findIndex(l => l.id === id), prev = list[i - 1], next = list[i + 1];
  const body = renderBlocks(localized(doc, lang), { mode: 'read' });
  paint(`<div class="layout">${side(id)}<main class="page"><div class="page__head"><span class="k-page__eyebrow">${esc(nm(course))}${unit ? ' · ' + esc(nm(unit)) : ''}</span>
    <h1 class="t-display" style="margin:0">${esc(t().no(lesson.no))} ${esc(nm(lesson))}</h1></div>
    <article class="kd" lang="${lang}">${body || `<div class="k-callout"><span>${esc(t().empty)}</span></div>`}</article>
    ${prev || next ? `<nav class="pn">${prev ? `<a class="k-btn k-btn--lg" href="#lesson=${prev.id}">${esc(t().prev)}</a>` : ''}${next ? `<a class="k-btn k-btn--lg" href="#lesson=${next.id}">${esc(t().next)}</a>` : ''}</nav>` : ''}</main></div>`);
  // 파이썬·스크래치 도구 블록: [열기] → 그 도구 화면
  document.querySelectorAll('.kd-tool__slot').forEach(s => { s.innerHTML = `<a class="k-btn k-btn--primary" href="/k/${s.dataset.tool === 'scratch' ? 'scratch' : 'py'}.html?lesson=${encodeURIComponent(id)}&block=${encodeURIComponent(s.dataset.block)}">${esc(t().open)}</a>`; });
}

function showList() {
  const cs = today?.courses || [];
  if (!cs.some(c => c.lessons.length)) return paint(msg(t().none, t().noneSub));
  paint(`<main class="page page--wide"><div class="page__head"><h1 class="t-display" style="margin:0">${esc(t().list)}</h1></div>
    <div class="k-columns">${cs.filter(c => c.lessons.length).map(c => `<section class="course"><h2 class="t-title" style="margin:0">${esc(nm(c))}</h2>
      ${c.units.filter(u => c.lessons.some(l => l.unitId === u.id)).map(u => `<p class="unit-name">${esc(nm(u))}</p>
        <ol class="k-lessons">${c.lessons.filter(l => l.unitId === u.id).map(l => `<li><a class="k-lesson ${l.id === today.current ? 'k-lesson--today' : ''}" href="#lesson=${l.id}"><span class="k-lesson__no">${esc(t().no(l.no))}</span><span><span class="k-lesson__head"><span class="k-lesson__title">${esc(nm(l))}</span>${l.id === today.current ? `<span class="k-chip k-chip--live">${esc(t().now)}</span>` : ''}</span></span></a></li>`).join('')}</ol>`).join('')}
    </section>`).join('')}</div></main>`);
}

async function route() {
  try {
    if (!today) { today = await api('today'); if (today.error) { today = null; return paint(msg(t().fail, '')); } }
    const h = location.hash;
    view = h.startsWith('#list') ? 'list' : 'lesson';
    if (view === 'list') showList();
    else await showLesson(h.startsWith('#lesson=') ? h.slice(8) : today.current);
    scrollTo(0, 0);
  } catch (e) { if (!/logout|relogin/.test(e.message)) paint(msg(t().fail)); }
}

document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b?.id === 'lang-btn') { menuOpen = !menuOpen; return rerender(); }
  if (b?.dataset.lang) { lang = b.dataset.lang; setLang(lang); menuOpen = false; return rerender(); }
  if (b?.id === 'logout') { logout(); return; }
  if (menuOpen && !e.target.closest('.lang')) { menuOpen = false; rerender(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && menuOpen) { menuOpen = false; rerender(); } });
function rerender() { const y = scrollY; (view === 'list' ? (showList(), Promise.resolve()) : showLesson(location.hash.startsWith('#lesson=') ? location.hash.slice(8) : today?.current)).then(() => scrollTo(0, y)); }
addEventListener('hashchange', route);

route();
</script>
</body>
</html>
