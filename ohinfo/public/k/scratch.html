<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크래치 · kaká</title>
<link rel="icon" href="/kaka/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/kaka/kaka.css?v=1128">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; margin: 0; overflow: hidden; }
  .k-header { flex: none; }
  .back { font: 500 15px/20px var(--font-sans); color: var(--ink-2); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .back:hover { color: var(--ink); }
  .title { font: 600 15px/20px var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .save { font: 400 13px/20px var(--font-sans); color: var(--ink-3); white-space: nowrap; }
  .save.is-err { color: var(--danger); }
  .hist-wrap { position: relative; }
  .hist-wrap .k-menu[hidden] { display: none; }
  .hist-wrap .k-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; max-height: 60vh; overflow: auto; min-width: 260px; }
  .k-menu .none { padding: 8px 10px; font: 400 14px/20px var(--font-sans); color: var(--ink-3); }
  .stage { position: relative; flex: 1; min-height: 0; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .cover { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg); font: 500 15px/22px var(--font-sans); color: var(--ink-2); z-index: 2; }
</style>
</head>
<body>
<div class="sk-head" aria-hidden="true"><span class="sk" style="width:92px;height:22px"></span><span class="sk" style="width:160px;height:16px"></span></div>
<script type="module">
// kaká 스크래치 — 차시 문서의 스크래치 도구 블록 [열기] → kakainfo.com/k/scratch.html?lesson=&block=
// 편집기는 같은 사이트 /scratch/editor.html(공식 scratch-gui)을 iframe 으로 열고 window.kScratch 로 불러오기·저장한다.
// 작품은 서버(/api/lesson scratch-*) → Firestore: project.json 은 scratch_projects, 그림·소리는 scratch_assets(같은 파일은 한 벌), 저장 기록은 work_history.
// 설계: PLATFORM-DESIGN.md §8.10
import { LOGO_SVG } from '/kaka/logo.js?v=1128';
import { icon } from '/kaka/icons.js?v=1128';
import { session, api, getLang, esc, nameIn, stuNo } from '/k/stu.js?v=1128';

const T = {
  ko: { save: '저장', saved: '저장됨', saving: '저장 중…', unsaved: '저장 안 됨', saveFail: '저장 실패 — 인터넷을 확인하세요', loading: '스크래치를 여는 중…', hist: '저장 기록', histNone: '아직 저장 기록이 없습니다.', closed: '열 수 없는 활동입니다.', fail: '불러오지 못했습니다. 새로고침하세요.', opened: '예전 기록을 열었습니다. 고치면 이것이 지금 작업으로 저장됩니다.', tooBig: '너무 큽니다 — 큰 소리·그림(10MB까지)이나 스프라이트를 줄여 주세요.', reason: { auto: '자동', save: '저장', leave: '나갈 때' }, blocks: n => `블록 ${n}개` },
  zh: { save: '保存', saved: '已保存', saving: '保存中…', unsaved: '未保存', saveFail: '保存失败 — 请检查网络', loading: '正在打开 Scratch…', hist: '保存记录', histNone: '还没有保存记录。', closed: '无法打开这个活动。', fail: '加载失败。请刷新页面。', opened: '已打开以前的记录。修改后会保存为当前作品。', tooBig: '太大了 — 请减小声音、图片（每个最多 10MB）或角色数量。', reason: { auto: '自动', save: '保存', leave: '离开时' }, blocks: n => `${n} 个积木` },
  ru: { save: 'Сохранить', saved: 'Сохранено', saving: 'Сохранение…', unsaved: 'Не сохранено', saveFail: 'Ошибка сохранения — проверьте интернет', loading: 'Открываем Scratch…', hist: 'История', histNone: 'Сохранений пока нет.', closed: 'Это задание нельзя открыть.', fail: 'Не удалось загрузить. Обновите страницу.', opened: 'Открыта старая версия. Если её изменить, она сохранится как текущая работа.', tooBig: 'Слишком большой — уменьшите звуки, картинки (до 10 МБ каждый) или число спрайтов.', reason: { auto: 'авто', save: 'сохр.', leave: 'при выходе' }, blocks: n => `блоков: ${n}` },
  en: { save: 'Save', saved: 'Saved', saving: 'Saving…', unsaved: 'Not saved', saveFail: 'Could not save — check the internet', loading: 'Opening Scratch…', hist: 'Saved versions', histNone: 'No saved versions yet.', closed: 'This activity cannot be opened.', fail: 'Could not load. Please refresh.', opened: 'Opened an older version. If you change it, it is saved as your current work.', tooBig: 'Too big — make sounds or pictures smaller (10 MB each) or use fewer sprites.', reason: { auto: 'auto', save: 'save', leave: 'on leave' }, blocks: n => `${n} blocks` },
};
const lang = getLang(T), t = T[lang];
const LOCALE = { ko: 'ko', zh: 'zh-cn', ru: 'ru', en: 'en' }[lang];
const q = new URLSearchParams(location.search), lessonId = q.get('lesson'), blockId = q.get('block');
const $ = s => document.querySelector(s);
const when = iso => { const d = new Date(iso); const same = d.toDateString() === new Date().toDateString(); return d.toLocaleString(lang === 'zh' ? 'zh-CN' : lang, same ? { hour: '2-digit', minute: '2-digit' } : { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }); };
const back = `/k/#lesson=${encodeURIComponent(lessonId || '')}`;
const fail = m => { document.body.innerHTML = `<main class="k-page"><div class="k-callout" style="max-width:560px"><span class="k-callout__label">${esc(m)}</span><a href="${back}">←</a></div></main>`; };

const d = await api('scratch-open', { lessonId, blockId }).catch(() => ({ error: 1 }));
if (d.error) { fail(d.closed ? t.closed : t.fail); await new Promise(() => {}); }
const bd = { ...d.block.data, ...(lang !== 'ko' ? d.block.tr?.[lang] || {} : {}) };
const lessonName = nameIn(d.lesson, lang);
document.title = `${bd.title || lessonName} · kaká`;
document.documentElement.lang = lang;

document.body.innerHTML = `<header class="k-header"><a class="k-logo" href="/k/" aria-label="kaká">${LOGO_SVG}</a>
  <a class="back" href="${back}">← ${esc(lessonName)}</a>${bd.title ? `<span class="title">${esc(bd.title)}</span>` : ''}
  <div class="k-header__end"><span class="save" id="save" aria-live="polite"></span>
    <button class="k-ibtn" id="save-btn" aria-label="${esc(t.save)}" data-tip="${esc(t.save)} · Ctrl+S">${icon('save')}</button>
    <div class="hist-wrap"><button class="k-ibtn k-ibtn--end" id="hist-btn" aria-label="${esc(t.hist)}" data-tip="${esc(t.hist)}" aria-haspopup="menu" aria-expanded="false">${icon('history')}</button><div class="k-menu" id="hist" role="menu" hidden></div></div>
    <span class="k-avatar" style="width:auto;min-width:32px;padding:0 10px;border-radius:999px">${esc(stuNo(session))}</span></div></header>
<div class="stage"><div class="cover" id="cover">${esc(t.loading)}</div><iframe id="ed" title="Scratch" src="/scratch/editor.html?locale=${LOCALE}" allow="microphone; camera"></iframe></div>`;

// ── 편집기 열기 → 내 작업(없으면 시작 파일) 불러오기 ──
const frame = $('#ed');
await new Promise(ok => frame.addEventListener('load', ok, { once: true }));
const S = frame.contentWindow.kScratch;
await S.ready;
let dirty = false, loading = true, history = d.history || [], saveT = null, inflight = Promise.resolve();
const status = (s, err) => { $('#save').textContent = s; $('#save').classList.toggle('is-err', !!err); };
async function loadFrom(extra) {
  loading = true;
  const r = await api('scratch-load', { lessonId, blockId, ...extra });
  if (r.error) throw new Error(r.error);
  if (r.json) await S.loadParts(r.json, r.assets);
  setTimeout(() => { loading = false; }, 300); // 불러오면서 생기는 바뀜 알림은 무시
}
status(d.work ? `${t.saved} ${when(d.work.updatedAt)}` : '');
try { if (d.work || d.block.data.starterId) await loadFrom({}); else loading = false; }
catch (e) { console.warn(e); status(t.fail, true); loading = false; }
$('#cover').remove();
window.kStu = { S, get dirty() { return dirty; }, save: r => save(r) }; // 테스트용 손잡이

// ── 저장: 고치면 30초 뒤 자동, [저장]·Ctrl+S, 나갈 때 ──
function save(reason = 'auto') {
  clearTimeout(saveT);
  if (!dirty && reason === 'auto') return inflight;
  dirty = false; status(t.saving);
  inflight = inflight.then(async () => {
    const p = await S.parts();
    let r = await api('scratch-save', { lessonId, blockId, json: p.json, reason });
    if (r.missing) { // 서버에 없는 그림·소리(새로 그린 것·올린 사진·녹음)만 올리고 다시 저장
      for (const id of r.missing) { const a = await api('scratch-asset', { lessonId, blockId, id, b64: S.asset(id) }); if (a.error) throw new Error(a.error); }
      r = await api('scratch-save', { lessonId, blockId, json: p.json, reason });
    }
    if (r.error || r.missing) throw new Error(r.error || 'missing');
    history = r.history; paintHist();
    status(dirty ? t.unsaved : `${t.saved} ${when(r.updatedAt)}`);
  }).catch(e => { dirty = true; if (!/logout|relogin/.test(e.message)) status(/너무 큽니다/.test(e.message) ? t.tooBig : t.saveFail, true); });
  return inflight;
}
S.onChange(() => { if (loading) return; dirty = true; status(t.unsaved); clearTimeout(saveT); saveT = setTimeout(() => save('auto'), 30000); });
const onKey = e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save('save'); } };
addEventListener('keydown', onKey); frame.contentWindow.addEventListener('keydown', onKey);
$('#save-btn').addEventListener('click', () => save('save'));
addEventListener('beforeunload', e => { if (dirty) { save('leave'); e.preventDefault(); } });

// ── 저장 기록: 눌러서 예전 기록 열기 ──
function paintHist() {
  $('#hist').innerHTML = history.length ? history.map(h => `<button role="menuitem" data-v="${esc(h.id)}"><span>${esc(when(h.at))} · ${esc(t.reason[h.reason] || h.reason)}</span><span class="code">${esc(t.blocks(h.blocks || 0))}</span></button>`).join('') : `<span class="none">${esc(t.histNone)}</span>`;
}
paintHist();
const menu = open => { $('#hist').hidden = !open; $('#hist-btn').setAttribute('aria-expanded', open); };
$('#hist-btn').addEventListener('click', e => { e.stopPropagation(); menu($('#hist').hidden); });
document.addEventListener('click', () => menu(false));
$('#hist').addEventListener('click', async e => {
  const b = e.target.closest('[data-v]'); if (!b) return;
  menu(false);
  if (dirty) await save('save');
  status(t.loading);
  try { await loadFrom({ versionId: b.dataset.v }); status(t.opened); } catch { status(t.fail, true); }
});
</script>
</body>
</html>
