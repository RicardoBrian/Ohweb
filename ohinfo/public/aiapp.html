<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 웹앱</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="ai-themes.css?v=202610190241">
  <style>
    html, body { margin: 0; min-height: 100%; }
    body { background: #fafafa; }
    #root, #root > .ai-app { min-height: 100vh; }
    .boot { min-height: 100vh; display: grid; place-items: center; font: 500 15px/1.5 "IBM Plex Sans KR", system-ui, sans-serif; color: #71717a; text-align: center; padding: 24px; }
  </style>
</head>
<body>
<!-- 학생 모둠이 AI 실험실에서 만든 웹앱. 로그인 없이 누구나 연다(학생 이름은 싣지 않는다).
     사진은 이 브라우저 안에서만 쓰고 어디에도 올리지 않는다. -->
<div id="root"><div class="boot" id="boot">…</div></div>
<input type="file" id="fileInput" accept="image/*" hidden>

<script type="module">
import { db } from './firebase-config.js';
import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { SAFE_ID } from './escape.js';
import { makeT, getLang, setLang } from './ai-i18n.js?v=202610190241';
import { appHtml, probsByLabel } from './ai-render.js?v=202610190241';
import { loadModel, loadDriveModel, predict, loadLibs } from './ai-model.js?v=202610190241';
import { extractFromTransfer, fetchFirstImage } from './ai-image.js?v=202610190241';

const params = new URLSearchParams(location.search);
const appId = params.get('id') || '';
const preview = params.get('preview') === '1';
let lang = getLang();
let t = makeT(lang);
const root = document.getElementById('root');
const boot = document.getElementById('boot');
boot.textContent = t('appLoading');

let app = null;
let loaded = null;          // 불러온 모델
let modelErr = '';
let photoUrl = '';
const state = { photo: '', probs: null, status: '', msg: '' };

function render() {
  if (!app) return;
  root.innerHTML = appHtml(app, lang, t, state);
  document.documentElement.lang = lang;
  const el = root.querySelector('.ai-app');
  // 화면을 끝까지 당겼을 때도 디자인 배경이 보이게
  document.body.style.background = getComputedStyle(el).backgroundColor || '';
}

function fail(msg) { boot.textContent = msg; }

async function start() {
  if (!SAFE_ID.test(appId)) return fail(t('notFound'));
  loadLibs().catch(() => {});   // 웹앱 정보를 읽는 동안 AI 라이브러리(tfjs)를 미리 받기 시작
  let snap;
  try { snap = await getDoc(doc(db, 'ai_apps', appId)); }
  catch { return fail(t('notFound')); }
  if (!snap.exists()) return fail(t('notFound'));
  app = snap.data();
  if (!app.published && !preview) return fail(t('notPublished'));
  document.title = app.title || 'AI';
  // 표 데이터 앱: 모델이 작은 식·나무라서 문서 안에 들어 있다(받을 파일 없음). 칸을 채우고 [물어보기]를 누른다.
  if (app.table && Array.isArray(app.table.features)) {
    state.tIn = app.table.features.map(f => f.def);
    render();
    tableCore = await import('./ai-table-core.js?v=202610190241');
    return;
  }
  // 문장 앱: 단어 조각 개수를 센 작은 모델이 문서 안에 들어 있다.
  if (app.text && app.text.model) {
    state.text = '';
    render();
    textCore = await import('./ai-text-core.js?v=202610190241');
    return;
  }
  render();
  // 사진을 고르기 전에 모델을 미리 받아 둔다.
  // 실험실에서 학습한 모델(배포한 번호)은 드라이브에서, 예전 방식은 티처블머신 링크에서.
  const loading = app.modelVersion ? loadDriveModel(null, appId, app.modelVersion) : loadModel(app.modelUrl);
  loading.then(m => { loaded = m; if (state.status === 'thinking') runPredict(); })
    .catch(e => {
      // 원인을 알 수 있게 짧은 오류 코드를 덧붙인다(선생님이 알려 주면 바로 찾을 수 있게).
      modelErr = (e && e.code === 'notPublished' ? t('notPublished') : t('modelFail')) + (e && (e.detail || e.code) ? ` (${e.detail || e.code})` : '');
      console.error('[aiapp] model', e); if (state.status === 'thinking') { state.status = 'error'; state.msg = modelErr; render(); } });
}

async function handleBlob(blob) {
  if (!app) return;
  if (!blob || !/^image\//.test(blob.type)) return;
  if (photoUrl) URL.revokeObjectURL(photoUrl);
  photoUrl = URL.createObjectURL(blob);
  state.photo = photoUrl; state.probs = null; state.status = 'thinking'; state.msg = '';
  render();
  if (modelErr) { state.status = 'error'; state.msg = modelErr; return render(); }
  if (loaded) runPredict();
}

let tableCore = null, textCore = null;
let _tseq = 0;
async function textPredict() {
  const box = root.querySelector('.aa-text');
  const txt = box ? box.value.trim() : '';
  if (!textCore || !txt) return;
  const my = ++_tseq;
  state.text = txt; state.probs = null; state.status = 'thinking'; render();
  // 뜻 이해 AI면 서버(/api/embed)로, 안 되면 단어 조각 AI로
  const r = await textCore.predictAny(app.text, txt).catch(() => textCore.predictText(app.text.model, txt));
  if (my !== _tseq) return;
  state.probs = r.probs; state.words = r.words; state.status = 'ready';
  render();
  const res = root.querySelector('.aa-result');
  if (res) res.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
root.addEventListener('input', e => { if (e.target.classList && e.target.classList.contains('aa-text')) state.text = e.target.value; });
root.addEventListener('keydown', e => {
  if (e.target.classList && e.target.classList.contains('aa-text') && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); textPredict(); }
});
function tablePredict() {
  if (!tableCore) return;
  const r = tableCore.appPredict(app.table, state.tIn);
  if (app.table.prob === 'class') state.probs = Object.fromEntries(r.p.map((p, i) => ['c' + i, p]));
  else state.tv = r.v;
  state.status = 'ready';
  render();
  const res = root.querySelector('.aa-result');
  if (res) res.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
// 숫자 칸: 밀기와 숫자 칸을 서로 맞춘다(다시 그리면 밀던 손이 끊기므로 칸만 고친다).
root.addEventListener('input', e => {
  const el = e.target.closest('[data-ti]');
  if (!el || !app || !app.table) return;
  const i = Number(el.dataset.ti), f = app.table.features[i];
  let v = Number(el.value);
  if (Number.isNaN(v)) return;
  state.tIn[i] = v;
  root.querySelectorAll(`[data-ti="${i}"]`).forEach(x => { if (x !== el && x.tagName === 'INPUT') x.value = String(Math.min(f.max, Math.max(f.min, v))); });
});

let _seq = 0;
async function runPredict() {
  const my = ++_seq;
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = state.photo; });
    const preds = await predict(loaded, img);
    if (my !== _seq) return;
    state.probs = probsByLabel(preds, app.mapping || {});
    state.status = 'ready';
  } catch {
    state.status = 'error'; state.msg = t('modelFail');
  }
  render();
}

async function handleTransfer(dt) {
  const { files, urls } = extractFromTransfer(dt);
  if (files.length) return handleBlob(files[0]);
  if (urls.length) {
    try { handleBlob(await fetchFirstImage(urls)); }
    catch { state.status = 'error'; state.msg = t('fetchFail'); render(); }
  }
}

const fileInput = document.getElementById('fileInput');
fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleBlob(fileInput.files[0]); fileInput.value = ''; });

root.addEventListener('click', e => {
  const langBtn = e.target.closest('[data-lang]');
  if (!app) return;
  if (langBtn) { lang = langBtn.dataset.lang; setLang(lang); t = makeT(lang); render(); return; }
  const opt = e.target.closest('[data-act="topt"]');
  if (opt) { state.tIn[Number(opt.dataset.ti)] = opt.dataset.v; render(); return; }
  if (e.target.closest('[data-act="tpredict"]')) { tablePredict(); return; }
  if (e.target.closest('[data-act="xpredict"]')) { textPredict(); return; }
  if (e.target.closest('[data-act="pick"]')) { fileInput.click(); return; }
  const cap = e.target.closest('[data-act="cap"]');
  if (cap) {
    // 그리기·카메라는 누를 때만 불러온다
    import('./ai-capture.js?v=202610190241').then(M => (cap.dataset.v === 'draw' ? M.openDraw : M.openCamera)({ t, onAdd: blob => handleBlob(blob), single: true }));
    return;
  }
  const zone = e.target.closest('[data-act="zone"]');
  if (zone) { zone.classList.add('active'); if (!state.photo) fileInput.click(); }
});
// 화면 어디에 떨어뜨려도 사진으로 받는다(칸 밖에 놓으면 브라우저가 그 사진으로 페이지를 바꿔 버리므로).
window.addEventListener('dragover', e => { e.preventDefault(); const z = root.querySelector('[data-act="zone"]'); if (z) z.classList.add('drag'); });
window.addEventListener('dragleave', e => { if (!e.relatedTarget) { const z = root.querySelector('[data-act="zone"]'); if (z) z.classList.remove('drag'); } });
window.addEventListener('drop', e => { e.preventDefault(); const z = root.querySelector('[data-act="zone"]'); if (z) z.classList.remove('drag'); if (app && !app.table && !app.text) handleTransfer(e.dataTransfer); });
window.addEventListener('paste', e => { if (app && !app.table && !app.text) handleTransfer(e.clipboardData); });
root.addEventListener('keydown', e => {
  const z = e.target.closest('[data-act="zone"]');
  if (z && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); fileInput.click(); }
});

start();
</script>
</body>
</html>
