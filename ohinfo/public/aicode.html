<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 코딩 — kakainfo</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="theme.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.5; display: flex; flex-direction: column; }
    .hidden { display: none !important; }
    button { font-family: inherit; }
    .ac-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 14px; border-bottom: 1px solid var(--border-card); background: var(--glass-strong); position: relative; z-index: 5; }
    .ac-top h1 { font-size: 1.02rem; margin: 0 6px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
    .ac-top .sp { flex: 1; }
    .ac-top a { color: var(--text-2); text-decoration: none; font-size: .88rem; white-space: nowrap; }
    .ac-name { width: 190px; font: inherit; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--border-card); background: var(--bg-elevated); color: var(--text); }
    .ac-btn { font: 700 .92rem/1 var(--font); padding: 10px 16px; border-radius: 999px; border: 1px solid var(--border-card); background: var(--bg-elevated); color: var(--text); cursor: pointer; white-space: nowrap; }
    .ac-btn.run { background: #30a46c; color: #fff; border-color: transparent; }
    .ac-btn.stop { background: #e5484d; color: #fff; border-color: transparent; }
    .ac-btn.on { outline: 3px solid rgba(48,164,108,.35); }
    .ac-btn:disabled { opacity: .5; cursor: default; }
    .ac-status { font-size: .8rem; color: var(--text-2); min-width: 54px; }
    .ac-lang { font: inherit; font-size: .85rem; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--border-card); background: var(--bg-elevated); color: var(--text); }
    .ac-main { flex: 1; display: flex; min-height: 0; }
    #blocklyDiv { flex: 1; min-width: 0; position: relative; }
    .ac-side { width: 400px; max-width: 46vw; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; border-left: 1px solid var(--border-card); background: var(--bg); }
    .ac-side > * { flex-shrink: 0; }
    .play .ac-side { width: 520px; max-width: 100%; margin: 0 auto; border-left: 0; }
    .play.blocks .ac-side { border-left: 1px solid var(--border-card); }
    .ac-stage { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--border-card); box-shadow: var(--shadow-sm); background: #fff; }
    .ac-stage canvas { display: block; width: 100%; aspect-ratio: 4 / 3; touch-action: manipulation; cursor: pointer; }
    .ac-ask { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; gap: 6px; background: rgba(255,255,255,.96); border-radius: 12px; padding: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
    .ac-ask input { flex: 1; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid #ccc; color: #111; background: #fff; }
    .ac-ask button { border: 0; border-radius: 8px; background: #30a46c; color: #fff; font-weight: 800; padding: 0 14px; cursor: pointer; }
    .ac-card { background: var(--glass-strong); border: 1px solid var(--border-card); border-radius: 14px; padding: 12px; }
    .ac-card h3 { margin: 0 0 8px; font-size: .92rem; }
    .ac-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .ac-chars { display: flex; flex-wrap: wrap; gap: 4px; }
    .ac-chars button { font-size: 22px; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border-card); background: var(--bg-elevated); cursor: pointer; }
    .ac-chars button.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-light); }
    .ac-cam { width: 100%; border-radius: 10px; margin-top: 8px; transform: scaleX(-1); background: #000; aspect-ratio: 4 / 3; object-fit: cover; }
    .ac-photo { max-width: 100%; max-height: 160px; border-radius: 10px; margin-top: 8px; display: block; }
    .ac-text { width: 100%; font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border-card); background: var(--bg-elevated); color: var(--text); resize: vertical; }
    .ac-f { display: grid; grid-template-columns: 1fr 120px; gap: 6px; align-items: center; margin: 4px 0; font-size: .88rem; }
    .ac-f input, .ac-f select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border-card); background: var(--bg-elevated); color: var(--text); width: 100%; }
    .ac-res { font-size: 1.15rem; font-weight: 800; margin-bottom: 6px; }
    .ac-bar { display: grid; grid-template-columns: minmax(60px, 34%) 1fr 42px; gap: 8px; align-items: center; font-size: .84rem; margin: 3px 0; }
    .ac-bar .tr { height: 10px; border-radius: 999px; background: var(--hairline); overflow: hidden; }
    .ac-bar .tr span { display: block; height: 100%; background: #0fbd8c; border-radius: inherit; transition: width .4s; }
    .ac-url { display: flex; gap: 6px; margin-top: 6px; }
    .ac-url input { flex: 1; min-width: 0; font: inherit; font-size: .8rem; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border-card); background: var(--bg-elevated); color: var(--text); }
    .ac-works a { display: block; padding: 4px 0; font-size: .88rem; }
    .muted { color: var(--text-2); font-size: .82rem; }
    .ac-msg { margin: auto; padding: 30px; text-align: center; max-width: 520px; }
    .ac-err { color: var(--danger); font-size: .85rem; }
    #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 50; background: #222; color: #fff; padding: 9px 16px; border-radius: 999px; font-size: .88rem; opacity: 0; transition: opacity .3s; pointer-events: none; }
    #toast.on { opacity: 1; }
    @media (max-width: 820px) {
      .ac-main { flex-direction: column; }
      #blocklyDiv { min-height: 56vh; }
      .ac-side { width: 100%; max-width: none; border-left: 0; border-top: 1px solid var(--border-card); }
      .ac-name { width: 140px; }
    }
  </style>
</head>
<body>
<!-- AI 코딩: 모둠이 배포한 AI(이미지·문장·표)를 블록으로 프로그램에 쓴다.
     ?id=프로젝트 → 모둠원이 내 작품을 만든다(로그인) / ?id=프로젝트&c=공유키 → 누구나 실행(로그인 없음) -->
<header class="ac-top" id="top"></header>
<main class="ac-main" id="main"><div class="ac-msg" id="boot">…</div></main>
<input type="file" id="filePick" accept="image/*" hidden>
<div id="toast" aria-live="polite"></div>
<script type="module" src="aicode.js?v=202610190241"></script>
</body>
</html>
