<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scratch</title>
<!--
  스크래치 편집기(공식 scratch-gui 5.3.0, npm 패키지의 빌드 결과를 그대로 올림 — LICENSE-scratch-gui.txt).
  kaká 스크래치 화면(/k/scratch.html)이 iframe 으로 연다. 같은 사이트라 부모 화면이 window.kScratch(parts·asset·loadParts)로 불러오기·저장한다.
  주소: editor.html?locale=ko|zh-cn|ru|en
  다시 올리기: npm pack scratch-gui@버전 → dist/ 의 scratch-gui.js·extension-worker.js·chunks·static(blocks-media, 쓰는 assets만) 복사.
  고친 것: scratch-gui.js 안 fetch-worker 의 publicPath p="/" → p="" (사이트 루트 /chunks/ 가 아니라 이 폴더 chunks/ 에서 찾게).
  chunks/fetch-worker.*.js 는 scratch-gui 패키지에 빠져 있어 scratch-storage@4.1.27 dist/web/chunks 에서 가져옴.
-->
<style>
  html, body, #app { margin: 0; height: 100%; }
  body { overflow: hidden; }
  /* 스크래치 사이트로 나가는 것들(로고 링크·공유·프로젝트 페이지)은 숨긴다. 우리 화면 위쪽 막대가 저장을 맡는다. */
  [class*="menu-bar_scratch-logo"], [class*="share-button"], [class*="community-button"], [class*="menu-bar_account-info-group"] { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<script src="react.min.js"></script>
<script src="react-dom.min.js"></script>
<script>window.react = window.React; window['react-dom'] = window.ReactDOM;</script>
<script src="scratch-gui.js"></script>
<script>
(function () {
  var G = window.GUI, app = document.getElementById('app');
  var Gui = G.AppStateHOC(G.default);
  var resolveReady, listeners = [];
  var ready = new Promise(function (r) { resolveReady = r; });
  G.setAppElement(app);
  function b64ToBuf(b64) { var s = atob(b64), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  function bufToB64(u) { var s = ''; for (var i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
  var TYPE = { svg: 'ImageVector', png: 'ImageBitmap', jpg: 'ImageBitmap', jpeg: 'ImageBitmap', bmp: 'ImageBitmap', gif: 'ImageBitmap', wav: 'Sound', mp3: 'Sound' };
  // 지금 프로젝트의 그림·소리: { 'md5.확장자': Asset }
  function assetMap(vm) {
    var out = {};
    vm.runtime.targets.forEach(function (t) {
      if (!t.isOriginal) return;
      t.sprite.costumes.concat(t.sprite.sounds).forEach(function (c) { var a = c.asset; if (a && a.data) out[a.assetId + '.' + a.dataFormat] = a; });
    });
    return out;
  }
  // 부모 창과는 글자(base64·JSON)로만 주고받는다 — 다른 창의 ArrayBuffer 는 instanceof 를 통과 못 해 JSZip 이 못 읽는다.
  window.kScratch = {
    ready: ready,
    vm: null,
    // 서버 저장 형식: project.json 글자 + 그림·소리 이름 목록. 내용은 asset(이름)으로 따로(서버에 없는 것만 올리게)
    parts: function () { return ready.then(function (vm) { return { json: vm.toJSON(), ids: Object.keys(assetMap(vm)) }; }); },
    asset: function (id) { var a = assetMap(window.kScratch.vm)[id]; return a ? bufToB64(a.data) : null; },
    // 서버 형식으로 불러오기: assets = { 'md5.확장자': base64 }. 없는 그림·소리는 스크래치 라이브러리에서 찾는다.
    loadParts: function (json, assets) {
      return ready.then(function (vm) {
        var st = vm.runtime.storage;
        Object.keys(assets || {}).forEach(function (id) {
          var m = /^([a-f0-9]{32})\.(\w+)$/.exec(id); if (!m || !TYPE[m[2]]) return;
          st.builtinHelper._store(st.AssetType[TYPE[m[2]]], m[2], b64ToBuf(assets[id]), m[1]);
        });
        return vm.loadProject(json);
      });
    },
    // .sb3 파일(base64)을 불러온다 — 선생님 시작 파일 올리기
    loadSb3: function (b64) { return ready.then(function (vm) { return vm.loadProject(b64ToBuf(b64).buffer); }); },
    // 학생이 고칠 때마다 부른다
    onChange: function (fn) { listeners.push(fn); },
    stats: function () {
      var vm = window.kScratch.vm; if (!vm) return null;
      var targets = vm.runtime.targets.filter(function (t) { return t.isOriginal; });
      var blocks = 0; targets.forEach(function (t) { blocks += Object.keys(t.blocks._blocks).length; });
      return { sprites: targets.filter(function (t) { return !t.isStage; }).length, blocks: blocks };
    },
  };
  ReactDOM.render(React.createElement(Gui, {
    projectId: '0', canSave: false, canCreateNew: false, canEditTitle: false, canShare: false, canRemix: false,
    showComingSoon: false, backpackVisible: false, isScratchDesktop: false,
    onVmInit: function (vm) {
      window.kScratch.vm = vm;
      vm.on('PROJECT_CHANGED', function () { listeners.forEach(function (fn) { try { fn(); } catch (e) { console.error(e); } }); });
      // 편집기가 처음 기본 프로젝트(고양이)를 다 띄운 뒤에 준비됨 — 그 전에 불러오면 기본 프로젝트가 덮어쓴다
      var first = function () { vm.runtime.off('PROJECT_LOADED', first); setTimeout(function () { resolveReady(vm); }, 0); };
      vm.runtime.on('PROJECT_LOADED', first);
    },
  }), app);
  // 다른 사이트(선생님 화면 admin.kakainfo.com)에서 열 때: postMessage
  //   부모 → {type:'kaka-scratch-load', json, assets}  학생 작품 띄우기(보기용)  → {type:'kaka-scratch-loaded', ok, error}
  //   부모 → {type:'kaka-scratch-unpack', b64}         .sb3 를 서버 형식으로    → {type:'kaka-scratch-unpacked', ok, json, assets, error}
  //   편집기 → {type:'kaka-scratch-ready'}
  ready.then(function () { if (window.parent !== window) window.parent.postMessage({ type: 'kaka-scratch-ready' }, '*'); });
  window.addEventListener('message', function (e) {
    var m = e.data || {}, K = window.kScratch;
    var reply = function (o) { e.source.postMessage(o, '*'); };
    var fail = function (type) { return function (err) { reply({ type: type, ok: false, error: String(err && err.message || err) }); }; };
    if (m.type === 'kaka-scratch-load' && typeof m.json === 'string') {
      K.loadParts(m.json, m.assets).then(function () { reply({ type: 'kaka-scratch-loaded', ok: true }); }, fail('kaka-scratch-loaded'));
    }
    if (m.type === 'kaka-scratch-unpack' && typeof m.b64 === 'string') {
      K.loadSb3(m.b64).then(K.parts).then(function (p) {
        var assets = {}; p.ids.forEach(function (id) { assets[id] = K.asset(id); });
        reply({ type: 'kaka-scratch-unpacked', ok: true, json: p.json, assets: assets, stats: K.stats() });
      }).catch(fail('kaka-scratch-unpacked'));
    }
  });
})();
</script>
</body>
</html>
