<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차시 문서 · kaká</title>
<link rel="icon" href="https://kakainfo.com/kaka/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://kakainfo.com/kaka/kaka.css">
<script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@2.31.7/dist/editorjs.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/header@2.8.9/dist/header.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/list@2.0.9/dist/editorjs-list.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/code@2.9.4/dist/code.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/table@2.4.6/dist/table.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/inline-code@1.5.2/dist/inline-code.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/marker@1.4.0/dist/marker.umd.js"></script>
<style>
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .k-tabs { max-width: 720px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin: 0 0 var(--space-5); }
  .bar .k-tabs { border-bottom: 0; }
  .save { font: 400 13px/20px var(--font-sans); color: var(--ink-2); margin-left: var(--space-3); }
  .save.is-dirty { color: var(--warn); }
  #editor { padding-left: 60px; margin-left: -60px; }
  .tr-row { max-width: 760px; display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 380px); gap: var(--space-5); padding: var(--space-4) 0; border-bottom: 1px solid var(--line); }
  .tr-src { font-size: 15px; line-height: 24px; color: var(--ink-2); }
  .tr-src .kd { font-size: 15px; line-height: 24px; color: var(--ink-2); }
  .tr-src .kd > * { margin: 0 0 6px; }
  .tr-out { display: grid; gap: 6px; align-content: start; }
  .tr-ed { min-height: 24px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface); outline: none; }
  .tr-ed:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: var(--accent); }
  .tr-ed:empty::before { content: '번역 없음'; color: var(--ink-3); }
  .langs .k-btn[aria-pressed="true"] { background: var(--surface-2); border-color: var(--line-strong); }
  @media (max-width: 760px) { .tr-row { grid-template-columns: 1fr; gap: var(--space-2); } #editor { padding-left: 0; margin-left: 0; } .k-header .k-btn--ghost { display: none; } }
</style>
</head>
<body>
<p class="k-page k-muted">불러오는 중입니다.</p>
<script type="module">
import { $, esc, chip, header, toast, requireAdmin, loadLessons, orderLessons, courseLabel, db, doc, getDoc, addDoc, updateDoc, collection, serverTimestamp } from './k.js';
import { LANGS, fsEncode, fsDecode, textsOf, withTexts, needsTr, srcKey, localized, renderBlocks, blockHtml, DOC_CSS } from './render.js';
import { Slide, Callout, Image, Tool, Timer, Note, EDITOR_CSS } from './blocks.js';

await requireAdmin();
document.head.insertAdjacentHTML('beforeend', `<style>${DOC_CSS}${EDITOR_CSS}</style>`);
const lessonId = new URLSearchParams(location.search).get('id');
const lSnap = lessonId && await getDoc(doc(db, 'course_lessons', lessonId));
if (!lSnap?.exists()) {
  document.body.innerHTML = header('course') + `<main class="k-page"><div class="k-callout k-callout--warn"><span class="k-callout__label">차시를 찾지 못했습니다</span><span><a href="index.html">오늘 화면</a>에서 과목을 고르세요.</span></div></main>`;
  throw new Error('no lesson');
}
const lesson = { id: lessonId, ...lSnap.data() };
const course = { id: lesson.courseId, ...(await getDoc(doc(db, 'courses', lesson.courseId))).data() };
const no = orderLessons(course, await loadLessons(course.id)).find(l => l.id === lessonId)?.no;
const unit = (course.units || []).find(u => u.id === lesson.unitId);
let cur = { blocks: [], tr: {} };
if (lesson.docId) { const d = await getDoc(doc(db, 'docs', lesson.docId)); if (d.exists()) cur = { tr: {}, ...fsDecode(d.data()) }; }
let mode = 'edit', trLang = 'zh', viewLang = 'ko';

document.title = `${no}차시 ${lesson.name} · kaká`;
document.body.innerHTML = header('course') + `<main class="k-page">
  <div class="k-page__head"><span class="k-page__eyebrow"><a href="course.html?id=${course.id}" style="color:inherit">${esc(courseLabel(course))}</a>${unit ? ' · ' + esc(unit.name) : ''}</span>
    <h1 class="t-display">${no}차시 ${esc(lesson.name)}</h1></div>
  <div class="bar"><div class="k-tabs" role="tablist">${[['edit', '편집'], ['tr', '번역'], ['view', '미리 보기']].map(([k, n]) => `<button class="k-tab" role="tab" data-mode="${k}" aria-selected="${k === mode}">${n}</button>`).join('')}</div>
    <button class="k-btn k-btn--sm" id="present">발표</button><span class="save" id="save" aria-live="polite"></span></div>
  <div id="editor"></div><div id="pane" hidden></div></main>`;

// ── 편집기 ──
const editor = new EditorJS({
  holder: 'editor', data: { blocks: cur.blocks || [] }, autofocus: !cur.blocks?.length, placeholder: '여기에 수업 글을 씁니다. 빈 줄에서 + 를 누르면 블록을 넣습니다.',
  i18n: { messages: { ui: { blockTunes: { toggler: { 'Click to tune': '설정', 'or drag to move': '끌어서 옮기기' } }, toolbar: { toolbox: { Add: '넣기' } }, popover: { Filter: '찾기', 'Nothing found': '없습니다', 'Convert to': '바꾸기' } },
    toolNames: { Text: '글', Heading: '제목', 'Unordered List': '목록', 'Ordered List': '번호 목록', Checklist: '체크 목록', Code: '코드', Table: '표', Marker: '형광', InlineCode: '코드 글자', Bold: '굵게', Italic: '기울임', Link: '링크' },
    tools: { header: { 'Heading 1': '제목 1(새 슬라이드)', 'Heading 2': '제목 2', 'Heading 3': '제목 3' } },
    blockTunes: { delete: { Delete: '지우기', 'Click to delete': '한 번 더 누르면 지웁니다' }, moveUp: { 'Move up': '위로' }, moveDown: { 'Move down': '아래로' } } } },
  tools: {
    header: { class: Header, inlineToolbar: true, config: { levels: [1, 2, 3], defaultLevel: 2 } },
    list: { class: EditorjsList, inlineToolbar: true, config: { defaultStyle: 'unordered' } },
    callout: { class: Callout, inlineToolbar: true }, image: { class: Image, inlineToolbar: true },
    tool: Tool, slide: Slide, timer: Timer, note: { class: Note, inlineToolbar: true },
    code: CodeTool, table: { class: Table, inlineToolbar: true }, marker: Marker, inlineCode: InlineCode,
  },
  onChange: () => { dirty(); clearTimeout(saveT); saveT = setTimeout(save, 1500); },
});
window.kEditor = editor;
await editor.isReady;

let saveT, saving = null, isDirty = false;
const status = (t, d) => { $('#save').textContent = t; $('#save').classList.toggle('is-dirty', !!d); };
function dirty() { isDirty = true; status('바뀐 내용 저장 전', true); }
status(lesson.docId ? `저장됨` : '아직 저장한 내용이 없습니다');
addEventListener('beforeunload', e => { if (isDirty) e.preventDefault(); });

async function save() {
  if (saving) { await saving; if (!isDirty) return; }
  saving = (async () => {
    isDirty = false; status('저장 중');
    const { blocks } = await editor.save();
    try {
      if (!lesson.docId) {
        const r = await addDoc(collection(db, 'docs'), { kind: 'lesson', courseId: course.id, lessonId, blocks: fsEncode(blocks), tr: {}, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
        lesson.docId = r.id;
        await updateDoc(doc(db, 'course_lessons', lessonId), { docId: r.id, updatedAt: serverTimestamp() });
      } else await updateDoc(doc(db, 'docs', lesson.docId), { blocks: fsEncode(blocks), updatedAt: serverTimestamp() });
      cur.blocks = blocks;
      status('저장됨 ' + new Date().toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' }));
    } catch (err) { isDirty = true; status('저장하지 못했습니다: ' + err.code, true); }
  })();
  await saving; saving = null;
}

// ── 번역 ──
const trOf = lang => (cur.tr[lang] ||= {});
async function translateAll() {
  const lang = trLang, todo = cur.blocks.filter(b => needsTr(b) && (!cur.tr[lang]?.[b.id] || cur.tr[lang][b.id].src !== srcKey(b)));
  if (!todo.length) return toast('번역할 블록이 없습니다.');
  toast(`${todo.length}개 블록을 번역하는 중입니다.`);
  const texts = todo.flatMap(textsOf);
  const res = await fetch('/api/translate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ texts, targetLang: lang === 'zh' ? 'zh-cn' : lang, sourceLang: 'ko', format: 'html' }) });
  const d = await res.json().catch(() => ({}));
  if (!d.translations) return toast('번역하지 못했습니다: ' + (d.error || res.status));
  const out = d.translations.map(t => t.text), patch = {};
  for (const b of todo) {
    const n = textsOf(b).length, v = { src: srcKey(b), data: withTexts(b, out.splice(0, n)) };
    trOf(lang)[b.id] = v; patch[`tr.${lang}.${b.id}`] = fsEncode(v);
  }
  await updateDoc(doc(db, 'docs', lesson.docId), { ...patch, updatedAt: serverTimestamp() });
  renderPane(); toast('번역 초안을 넣었습니다. 고칠 곳을 고치세요.');
}
async function saveTr(id) {
  const b = cur.blocks.find(x => x.id === id), eds = [...document.querySelectorAll(`[data-tr="${id}"]`)];
  const v = { src: srcKey(b), data: withTexts(b, eds.map(e => e.innerHTML.trim())) };
  trOf(trLang)[id] = v;
  await updateDoc(doc(db, 'docs', lesson.docId), { [`tr.${trLang}.${id}`]: fsEncode(v), updatedAt: serverTimestamp() });
  status('번역 저장됨');
  eds[0]?.closest('.tr-out')?.querySelector('.k-chip')?.parentElement.remove();
}

function renderPane(focusId) {
  const pane = $('#pane');
  if (mode === 'tr') {
    const blocks = cur.blocks.filter(needsTr), tr = cur.tr[trLang] || {};
    const left = blocks.filter(b => !tr[b.id] || tr[b.id].src !== srcKey(b)).length;
    pane.innerHTML = `<div class="row langs" style="margin-bottom:var(--space-3)">${LANGS.slice(1).map(([k, n]) => `<button class="k-btn k-btn--sm" data-trlang="${k}" aria-pressed="${k === trLang}">${n}</button>`).join('')}
      <button class="k-btn k-btn--sm k-btn--primary" id="tr-all" ${left ? '' : 'disabled'}>번역 초안 만들기${left ? ` (${left}개)` : ''}</button></div>
      <p class="k-muted t-small" style="margin:0 0 var(--space-3)">${blocks.length ? `블록 ${blocks.length}개 중 ${blocks.length - left}개 번역됨. 고친 칸은 칸을 벗어날 때 저장됩니다.` : '번역할 글이 없습니다.'}</p>
      ${blocks.map(b => {
        const t = tr[b.id], stale = t && t.src !== srcKey(b), vals = t ? textsOf({ ...b, data: t.data }) : textsOf(b).map(() => '');
        return `<div class="tr-row"><div class="tr-src"><div class="kd">${blockHtml(b, { mode: 'read' }) || esc(textsOf(b).join(' / '))}</div></div>
          <div class="tr-out">${!t ? `<span>${chip('warn', '번역 없음')}</span>` : stale ? `<span>${chip('warn', '원문이 바뀜')}</span>` : ''}
          ${vals.map(v => `<div class="tr-ed" contenteditable="true" data-tr="${b.id}">${v}</div>`).join('')}</div></div>`;
      }).join('')}`;
    if (focusId) pane.querySelector(`[data-tr="${focusId}"]`)?.closest('.tr-row')?.scrollIntoView({ block: 'nearest' });
  } else if (mode === 'view') {
    pane.innerHTML = `<div class="row langs" style="margin-bottom:var(--space-5)">${LANGS.map(([k, n]) => `<button class="k-btn k-btn--sm" data-viewlang="${k}" aria-pressed="${k === viewLang}">${n}</button>`).join('')}
      <span class="k-muted t-small">학생 화면 글자 크기입니다. 왼쪽 겨자색 줄은 번역이 없거나 원문이 바뀐 곳입니다.</span></div>
      <article class="kd" lang="${viewLang}">${renderBlocks(localized(cur, viewLang), { mode: 'read', marks: true }) || '<p class="k-muted">아직 내용이 없습니다.</p>'}</article>`;
  }
}

async function setMode(m) {
  if (m !== 'edit' && (isDirty || saving)) { clearTimeout(saveT); await save(); }
  if (m !== 'edit' && !lesson.docId) return toast('먼저 글을 쓰세요.');
  mode = m;
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-selected', b.dataset.mode === m));
  $('#editor').hidden = m !== 'edit'; $('#pane').hidden = m === 'edit';
  renderPane();
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.mode) return setMode(b.dataset.mode);
  if (b.dataset.trlang) { trLang = b.dataset.trlang; return renderPane(); }
  if (b.dataset.viewlang) { viewLang = b.dataset.viewlang; return renderPane(); }
  if (b.id === 'tr-all') { b.disabled = true; try { await translateAll(); } catch (err) { b.disabled = false; toast('번역하지 못했습니다: ' + (err.code || err.message)); } }
  if (b.id === 'present') {
    if (isDirty || saving) { clearTimeout(saveT); await save(); }
    if (!lesson.docId) return toast('먼저 글을 쓰세요.');
    open(`present.html?doc=${lesson.docId}&lang=${mode === 'view' ? viewLang : 'ko'}`, '_blank');
  }
});
document.addEventListener('focusout', e => { const id = e.target.dataset?.tr; if (id) saveTr(id).catch(err => toast('번역을 저장하지 못했습니다: ' + err.code)); });
</script>
</body>
</html>
