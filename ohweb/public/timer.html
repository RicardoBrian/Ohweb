<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수업 타이머 — kakainfo 관리자</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="theme.css">
  <script src="admin-auth.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; font-family: var(--font); color: var(--text); }

    /* ── Nav ── */
    .nav { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 56px; background: var(--glass-strong); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .btn-icon { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; transition: background 0.2s; color: var(--text); }
    .btn-icon:hover { background: var(--glass-strong); }
    .dark-toggle { width: 38px; height: 22px; border-radius: 50px; background: var(--glass); border: 1px solid var(--border); backdrop-filter: var(--blur); cursor: pointer; position: relative; transition: 0.3s; }
    body.dark .dark-toggle { background: rgba(42,92,230,0.6); border-color: rgba(100,140,255,0.4); }
    .dark-toggle::after { content:''; position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,0.2); transition:transform 0.3s; }
    body.dark .dark-toggle::after { transform: translateX(16px); }

    /* ── Layout ── */
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 16px; gap: 20px; }

    /* ═══════════════════════════════════════
       SETUP VIEW (설정 화면)
    ═══════════════════════════════════════ */
    #setupView { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; max-width: 560px; }
    #setupView.hidden { display: none; }

    .title-card {
      width: 100%;
      background: var(--glass-strong); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--border); border-radius: 24px; padding: 22px 26px;
      box-shadow: var(--highlight), var(--shadow-md);
    }
    .field-label { font-size: 0.7rem; font-weight: 700; color: var(--sub); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
    .title-row { display: flex; gap: 10px; align-items: center; }
    .title-inp {
      flex: 1; min-width: 0; padding: 11px 16px; border-radius: 12px;
      border: 1px solid var(--border-card); background: var(--glass);
      color: var(--text); font-family: var(--font); font-size: 1rem; font-weight: 600;
      backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .title-inp:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-light); }
    .title-inp::placeholder { color: var(--text-3); font-weight: 400; }
    .btn-translate {
      padding: 11px 16px; border-radius: 12px; border: 1px solid var(--border-card);
      background: var(--glass); color: var(--text); font-family: var(--font);
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
      box-shadow: var(--highlight); white-space: nowrap;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-translate:hover { background: var(--glass-strong); }
    .btn-translate:active { transform: scale(0.97); }
    .btn-translate:disabled { opacity: 0.5; cursor: not-allowed; }
    .trans-row { display: flex; gap: 10px; margin-top: 12px; }
    .trans-chip { flex: 1; background: var(--glass); border: 1px solid var(--border-card); border-radius: 10px; padding: 8px 12px; }
    .trans-lang { font-size: 0.62rem; font-weight: 700; color: var(--sub); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 3px; }
    .trans-text { font-size: 0.88rem; font-weight: 600; color: var(--text); min-height: 20px; }
    .trans-text.loading { color: var(--text-3); font-style: italic; font-size: 0.8rem; }

    .timer-setup-card {
      width: 100%;
      background: var(--glass-strong); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--border); border-radius: 24px; padding: 22px 26px;
      box-shadow: var(--highlight), var(--shadow-md);
    }
    .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .preset-btn {
      padding: 8px 18px; border-radius: 20px; border: 1px solid var(--border-card);
      background: var(--glass); color: var(--text); font-family: var(--font);
      font-size: 0.88rem; font-weight: 600; cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .preset-btn:hover { background: var(--glass-strong); }
    .preset-btn:active { transform: scale(0.95); }
    .preset-btn.active { background: var(--accent-grad); color: #fff; border-color: transparent; }
    .custom-row { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
    .custom-inp {
      width: 68px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border-card);
      background: var(--glass); color: var(--text); font-family: var(--font);
      font-size: 0.92rem; font-weight: 600; text-align: center; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .custom-inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
    .custom-label { font-size: 0.82rem; color: var(--sub); font-weight: 600; }

    /* ═══════════════════════════════════════
       RUN VIEW — 화면 반쪽(프로젝터·TV)에 띄우는 용도.
       브라우저 도구로 이미 좁으니 메뉴·버튼은 숨기고 글자만 크게.
       남은 시간 = 아래에서 위로 줄어드는 배경 게이지(B안)
    ═══════════════════════════════════════ */
    #runView { display: none; position: fixed; inset: 0; z-index: 200; background: var(--bg); overflow: hidden; --g: rgba(0,113,227,0.24); --gl: #0071e3; }
    #runView.visible { display: block; }
    #runView:not(.ui) { cursor: none; }
    #runView[data-st="warn"]   { --g: rgba(245,158,11,0.32); --gl: #f59e0b; }
    #runView[data-st="danger"] { --g: rgba(239,68,68,0.32);  --gl: #ef4444; }
    #runView[data-st="done"]   { --g: rgba(34,197,94,0.38);  --gl: #22c55e; }
    body.dark #runView { --g: rgba(10,132,255,0.34); }
    body.dark #runView[data-st="warn"]   { --g: rgba(245,158,11,0.36); }
    body.dark #runView[data-st="danger"] { --g: rgba(239,68,68,0.40); }
    body.dark #runView[data-st="done"]   { --g: rgba(34,197,94,0.40); }

    .gauge { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; background: var(--g); border-top: 0.6vmin solid var(--gl); transition: height 1s linear, background 0.5s, border-color 0.5s; }
    #runView[data-st="done"] .gauge { border-top-color: transparent; }

    .run-content { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4vmin; padding: 3vmin 4vw 14vmin; text-align: center; }
    .run-title-wrap { display: flex; flex-direction: column; align-items: center; gap: 1.2vmin; max-width: 100%; }
    .run-title-ko { font-size: clamp(2rem, 8.5vmin, 6.5rem); font-weight: 900; letter-spacing: -0.02em; line-height: 1.15; color: var(--text); word-break: keep-all; overflow-wrap: anywhere; }
    .run-line { font-size: clamp(1.5rem, 5.8vmin, 4.5rem); font-weight: 700; line-height: 1.2; color: var(--text); opacity: 0.9; overflow-wrap: anywhere; }
    .run-time-num { font-size: clamp(5rem, 27vmin, 22rem); font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1; color: var(--text); }
    #runView.no-title .run-time-num { font-size: clamp(5rem, 34vmin, 26rem); }
    #runView[data-st="danger"] .run-time-num { color: #dc2626; }
    #runView[data-st="done"]   .run-time-num { color: #15803d; }
    body.dark #runView[data-st="danger"] .run-time-num { color: #f87171; }
    body.dark #runView[data-st="done"]   .run-time-num { color: #4ade80; }
    .run-time-label { font-size: clamp(1.1rem, 3.2vmin, 2.2rem); font-weight: 700; color: var(--text-2); }
    @keyframes finalPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
    .run-time-num.final { animation: finalPulse 1s ease-in-out infinite; }

    /* 컨트롤: 평소엔 숨김(수업 화면엔 숫자만). 마우스·터치·키를 누르면 잠깐 나타남 */
    .run-controls { position: absolute; left: 50%; bottom: 2.5vmin; transform: translateX(-50%); display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; max-width: 96%; padding: 8px; border-radius: 18px; background: var(--glass-strong); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--border); opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    #runView.ui .run-controls { opacity: 1; pointer-events: auto; }
    .btn-ctrl { padding: 10px 18px; border-radius: 14px; border: 1px solid var(--border-card); background: var(--glass); color: var(--text); font-family: var(--font); font-size: 0.92rem; font-weight: 700; cursor: pointer; transition: filter 0.2s, transform 0.15s; }
    .btn-ctrl:active { transform: scale(0.95); }
    .btn-ctrl:hover { background: var(--glass-strong); }
    .btn-pause { background: var(--sky-cta, #1d1d1f); color: var(--sky-cta-text, #fff); border-color: transparent; }
    .btn-pause:hover { opacity: 0.88; background: var(--sky-cta, #1d1d1f); }
    .btn-sound { padding: 10px 12px; }

    /* 설정 화면: 최근 쓴 타이머 칩 */
    .recent-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .recent-row:empty { display: none; }
    .recent-chip { padding: 8px 14px; border-radius: 10px; border: 1px dashed var(--border-card); background: var(--glass); color: var(--text); font-family: var(--font); font-size: 0.85rem; font-weight: 600; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .recent-chip:hover { background: var(--glass-strong); }
    .start-hint { font-size: 0.78rem; color: var(--sub); margin-bottom: 10px; }

    /* ── 하늘(ui-sky) 디자인 — 수업 중 띄우는 도구라 사이드바 없이 화면을 크게 쓴다 ──
       ≥1100: 설정 카드 2장 나란히, 실행 화면 링은 화면 높이에 맞춰 크게 */
    body.ui-sky .nav { background: var(--glass-nav); border-bottom: 1px solid var(--border); }
    body.ui-sky .btn-icon { background: var(--sky-chip); border-color: var(--sky-chip-line); backdrop-filter: none; -webkit-backdrop-filter: none; }
    body.ui-sky .title-card, body.ui-sky .timer-setup-card { background: var(--surface); border-color: var(--border); border-radius: 18px; box-shadow: var(--shadow); }
    body.ui-sky .field-label, body.ui-sky .trans-lang { text-transform: none; letter-spacing: 0; }
    body.ui-sky .title-inp, body.ui-sky .custom-inp { background: var(--sky-chip); border-color: var(--sky-chip-line); backdrop-filter: none; -webkit-backdrop-filter: none; }
    body.ui-sky .btn-translate, body.ui-sky .preset-btn, body.ui-sky .recent-chip { background: var(--sky-chip); border-color: var(--sky-chip-line); box-shadow: none; }
    body.ui-sky .trans-chip { background: var(--sky-chip); border-color: var(--sky-chip-line); }
    body.ui-sky .preset-btn { border-radius: 10px; }
    body.ui-sky .preset-btn.active { background: var(--sky-cta); color: var(--sky-cta-text); }
    body.ui-sky .btn-pause { background: var(--sky-cta); color: var(--sky-cta-text); }
    @media (min-width: 1100px) {
      body.ui-sky #setupView:not(.hidden) { display: grid; grid-template-columns: 1fr 1fr; align-items: start; max-width: 1100px; gap: 20px; }
    }
  </style>
</head>
<body class="ui-sky">

<svg width="0" height="0" style="position:absolute;">
  <defs>
    <symbol id="ic-bell" viewBox="0 0 24 24"><path d="M6 10a6 6 0 0 1 12 0v4l1.8 3H4.2L6 14Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9.5 20a2.5 2.5 0 0 0 5 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="ic-bell-off" viewBox="0 0 24 24"><path d="M6 10a6 6 0 0 1 10.2-4.3M18 10v4l1.8 3H8.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v4L4.2 17H7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 20a2.5 2.5 0 0 0 5 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><line x1="3.5" y1="3.5" x2="20.5" y2="20.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="ic-expand" viewBox="0 0 24 24"><path d="M8 4H4v4M16 4h4v4M8 20H4v-4M16 20h4v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-play" viewBox="0 0 24 24"><path d="M7 5.5 19 12 7 18.5Z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="ic-back" viewBox="0 0 24 24"><path d="M18 12H5M10 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-bell-ring" viewBox="0 0 24 24"><path d="M6 10a6 6 0 0 1 12 0v4l1.8 3H4.2L6 14Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9.5 20a2.5 2.5 0 0 0 5 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  </defs>
</svg>

  <nav class="nav">
    <a href="admin.html" class="nav-brand">
      <img src="logo.png" alt="kakainfo">
      <span class="nav-brand-title">수업 타이머</span>
    </a>
    <div class="nav-right">
      <button class="btn-icon snd-btn" id="soundBtn" onclick="toggleSound()" title="알림음"><svg width="17" height="17"><use href="#ic-bell"/></svg></button>
      <button class="btn-icon" onclick="toggleFs()" title="전체화면"><svg width="16" height="16"><use href="#ic-expand"/></svg></button>
      <button class="dark-toggle" onclick="toggleDark()" title="다크모드"></button>
    </div>
  </nav>

  <main>
    <!-- ── 설정 화면 ── -->
    <div id="setupView">
      <!-- 제목 입력 -->
      <div class="title-card">
        <div class="field-label">타이머 제목 (주제)</div>
        <div class="title-row">
          <input class="title-inp" id="titleInp" placeholder="예: 1번 문제 풀기" maxlength="40" oninput="onTitleInput()">
          <button class="btn-translate" id="transBtn" onclick="doTranslate()" disabled>번역</button>
        </div>
        <div class="trans-row">
          <div class="trans-chip">
            <div class="trans-lang">中文</div>
            <div class="trans-text" id="transZh">—</div>
          </div>
          <div class="trans-chip">
            <div class="trans-lang">Русский</div>
            <div class="trans-text" id="transRu">—</div>
          </div>
          <div class="trans-chip">
            <div class="trans-lang">English</div>
            <div class="trans-text" id="transEn">—</div>
          </div>
        </div>
      </div>

      <!-- 시간 설정 + 시작 -->
      <div class="timer-setup-card">
        <div class="field-label" id="recentLabel" style="margin-bottom:10px;">최근 쓴 타이머</div>
        <div class="recent-row" id="recentRow"></div>
        <div class="field-label" style="margin-bottom:6px;">시간 선택</div>
        <div class="start-hint">시간을 누르면 바로 시작돼요. 제목을 적었다면 번역도 자동으로 붙어요.</div>
        <div class="presets" id="presets">
          <button class="preset-btn" onclick="setPreset(5,this)">5분</button>
          <button class="preset-btn" onclick="setPreset(10,this)">10분</button>
          <button class="preset-btn" onclick="setPreset(15,this)">15분</button>
          <button class="preset-btn" onclick="setPreset(20,this)">20분</button>
          <button class="preset-btn" onclick="setPreset(30,this)">30분</button>
        </div>
        <div class="custom-row">
          <span class="custom-label">직접 입력</span>
          <input class="custom-inp" id="customMin" type="number" min="0" max="99" placeholder="분" onkeydown="if(event.key==='Enter')startCustom()">
          <span class="custom-label">분</span>
          <input class="custom-inp" id="customSec" type="number" min="0" max="59" placeholder="초" onkeydown="if(event.key==='Enter')startCustom()">
          <span class="custom-label">초</span>
          <button class="preset-btn" onclick="startCustom()"><svg width="12" height="12" style="vertical-align:-1px;margin-right:4px;"><use href="#ic-play"/></svg>시작</button>
        </div>
      </div>
    </div>

  </main>

  <!-- ── 실행 화면 (전체 덮음) ── -->
  <div id="runView" data-st="ok">
    <div class="gauge" id="gauge"></div>
    <div class="run-content">
      <div class="run-title-wrap" id="runTitleWrap"></div>
      <div class="run-time-num" id="runTimeNum">00:00</div>
      <div class="run-time-label" id="runTimeLabel"></div>
    </div>
    <div class="run-controls" id="runControls">
      <button class="btn-ctrl" onclick="backToSetup()"><svg width="13" height="13" style="vertical-align:-1px;margin-right:4px;"><use href="#ic-back"/></svg>돌아가기</button>
      <button class="btn-ctrl" onclick="adjust(-60)">−1분</button>
      <button class="btn-ctrl" onclick="adjust(30)">+30초</button>
      <button class="btn-ctrl" onclick="adjust(60)">+1분</button>
      <button class="btn-ctrl btn-pause" id="pauseBtn" onclick="togglePause()">일시정지</button>
      <button class="btn-ctrl btn-sound snd-btn" onclick="toggleSound()" title="알림음"><svg width="17" height="17"><use href="#ic-bell"/></svg></button>
      <button class="btn-ctrl btn-sound" onclick="toggleFs()" title="전체화면"><svg width="16" height="16"><use href="#ic-expand"/></svg></button>
    </div>
  </div>

  <script>
    (async () => { await window.AdminAuth.ready; if (!window.AdminAuth.isValid()) location.href = 'index.html'; })();

    // ── 다크모드 ──
    function toggleDark() { document.body.classList.toggle('dark'); localStorage.setItem('dark', document.body.classList.contains('dark')?'1':'0'); }
    if (localStorage.getItem('dark') === '1') document.body.classList.add('dark');

    // ── 전체화면 ──
    function toggleFs() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{}); }

    // ── 사운드 ──
    let soundOn = true;
    let audioCtx = null;
    function toggleSound() {
      soundOn = !soundOn;
      const ic = soundOn ? '#ic-bell' : '#ic-bell-off';
      document.querySelectorAll('.snd-btn').forEach(b => { b.innerHTML = `<svg width="17" height="17"><use href="${ic}"/></svg>`; });
    }
    function playDone() {
      if (!soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        [523,659,784,1047].forEach((f, i) => {
          const o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.connect(g); g.connect(audioCtx.destination);
          o.frequency.value = f; o.type = 'sine';
          const t = audioCtx.currentTime + i * 0.2;
          g.gain.setValueAtTime(0.35, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
          o.start(t); o.stop(t + 0.55);
        });
      } catch(e) {}
    }

    // ── 번역 (중국어·러시아어·영어) ──
    const LANGS = [['zh','zh-cn','transZh'], ['ru','ru','transRu'], ['en','en','transEn']];
    let tr = { zh:'', ru:'', en:'' };
    function onTitleInput() {
      document.getElementById('transBtn').disabled = !document.getElementById('titleInp').value.trim();
      tr = { zh:'', ru:'', en:'' };
      LANGS.forEach(([,,id]) => setTransEl(id, '—'));
    }
    async function doTranslate() {
      const title = document.getElementById('titleInp').value.trim();
      if (!title) return;
      const btn = document.getElementById('transBtn');
      btn.disabled = true; btn.textContent = '…';
      LANGS.forEach(([,,id]) => { const el = document.getElementById(id); el.textContent = '번역 중…'; el.className = 'trans-text loading'; });
      try {
        const res = await Promise.all(LANGS.map(([,l]) => translate(title, l)));
        LANGS.forEach(([k,,id], i) => { tr[k] = res[i] || ''; setTransEl(id, tr[k] || '—'); });
      } catch(e) {
        LANGS.forEach(([,,id]) => setTransEl(id, '번역 실패'));
      }
      btn.disabled = false; btn.textContent = '번역';
    }
    function setTransEl(id, txt) { const el = document.getElementById(id); el.textContent = txt; el.className = 'trans-text'; }
    async function translate(text, lang) {
      const res = await fetch('/api/translate', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({texts:[text], targetLang:lang, sourceLang:'ko'}) });
      const data = await res.json();
      if (!res.ok || data.error || !data.translations) throw new Error(data.error || `HTTP ${res.status}`);
      return data.translations[0]?.text || '';
    }

    // ── 최근 쓴 타이머 (이 브라우저에만 저장) ──
    const RECENT_KEY = 'timerRecent';
    function loadRecent() { try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch(e) { return []; } }
    function fmtLen(s) { return Math.floor(s/60) + '분' + (s % 60 ? ' ' + (s % 60) + '초' : ''); }
    function saveRecent() {
      const title = document.getElementById('titleInp').value.trim();
      if (!title) return;
      const list = loadRecent().filter(r => !(r.title === title && r.secs === totalSecs));
      list.unshift({ title, secs: totalSecs, zh: tr.zh, ru: tr.ru, en: tr.en });
      try { localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 6))); } catch(e) {}
      renderRecent();
    }
    function renderRecent() {
      const list = loadRecent();
      document.getElementById('recentLabel').style.display = list.length ? '' : 'none';
      document.getElementById('recentRow').innerHTML = list.map((r, i) =>
        `<button class="recent-chip" onclick="useRecent(${i})">${escHtml(r.title)} · ${fmtLen(r.secs)}</button>`).join('');
    }
    function useRecent(i) {
      const r = loadRecent()[i]; if (!r) return;
      document.getElementById('titleInp').value = r.title;
      document.getElementById('transBtn').disabled = false;
      tr = { zh: r.zh || '', ru: r.ru || '', en: r.en || '' };
      LANGS.forEach(([k,,id]) => setTransEl(id, tr[k] || '—'));
      totalSecs = r.secs;
      startTimer();
    }

    // ── 타이머 상태 ──
    let totalSecs = 0, remainSecs = 0, running = false, interval = null, runKo = '', uiTimer = null;
    const runView = () => document.getElementById('runView');

    function fmt(s) { return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }

    // 시간 버튼을 누르면 바로 시작
    function setPreset(min) { totalSecs = min * 60; startTimer(); }
    function startCustom() {
      const total = (parseInt(document.getElementById('customMin').value) || 0) * 60 + (parseInt(document.getElementById('customSec').value) || 0);
      if (total <= 0) return;
      totalSecs = total; startTimer();
    }

    function renderRunTitle() {
      const wrap = document.getElementById('runTitleWrap');
      wrap.style.display = runKo ? '' : 'none';
      runView().classList.toggle('no-title', !runKo);
      wrap.innerHTML = runKo
        ? `<div class="run-title-ko">${escHtml(runKo)}</div>` +
          [['en','en'],['zh','zh-CN'],['ru','ru']].filter(([k]) => tr[k]).map(([k,l]) => `<div class="run-line" lang="${l}">${escHtml(tr[k])}</div>`).join('')
        : '';
    }

    // ── 실행 화면 진입 ──
    async function startTimer() {
      if (totalSecs === 0) return;
      remainSecs = totalSecs;
      running = true;
      runKo = document.getElementById('titleInp').value.trim();
      renderRunTitle();
      document.getElementById('setupView').classList.add('hidden');
      runView().classList.add('visible');
      document.getElementById('pauseBtn').textContent = '일시정지';
      updateRunView();
      clearInterval(interval);
      interval = setInterval(tick, 1000);
      showControls();
      saveRecent();
      // 제목은 있는데 번역이 없으면 시작과 동시에 자동 번역
      if (runKo && !tr.zh && !tr.ru && !tr.en) {
        const ko = runKo;
        await doTranslate();
        if (runKo === ko) { renderRunTitle(); saveRecent(); }
      }
    }

    function finish() {
      clearInterval(interval); running = false;
      document.getElementById('pauseBtn').textContent = '다시 시작';
      updateRunView();
      playDone();
    }
    function tick() {
      if (!running) return;
      remainSecs--;
      if (remainSecs <= 0) { remainSecs = 0; finish(); return; }
      updateRunView();
    }

    function updateRunView() {
      const pct = totalSecs > 0 ? remainSecs / totalSecs : 0;
      const done = remainSecs === 0 && totalSecs > 0;
      const st = done ? 'done' : pct <= 0.2 ? 'danger' : pct <= 0.5 ? 'warn' : 'ok';
      runView().dataset.st = st;
      document.getElementById('gauge').style.height = (done ? 100 : pct * 100) + '%';
      const num = document.getElementById('runTimeNum');
      num.textContent = fmt(remainSecs);
      num.classList.toggle('final', running && remainSecs > 0 && remainSecs <= 10);
      // 색만으로 구분하지 않도록 단계마다 문구도 함께
      document.getElementById('runTimeLabel').textContent =
        done ? '종료!' : !running ? '일시정지' : st === 'danger' ? '곧 끝나요' : st === 'warn' ? '절반 지났어요' : '진행 중';
      if (!running) showControls();
    }

    function togglePause() {
      if (remainSecs === 0) { remainSecs = totalSecs; running = true; clearInterval(interval); interval = setInterval(tick, 1000); document.getElementById('pauseBtn').textContent = '일시정지'; updateRunView(); showControls(); return; }
      running = !running;
      document.getElementById('pauseBtn').textContent = running ? '일시정지' : '계속';
      updateRunView(); showControls();
    }

    // 시간 늘리기·줄이기 (수업이 길어질 때)
    function adjust(d) {
      if (remainSecs === 0) {
        if (d < 0) return;
        totalSecs = remainSecs = d; running = true;
        clearInterval(interval); interval = setInterval(tick, 1000);
        document.getElementById('pauseBtn').textContent = '일시정지';
      } else {
        remainSecs = Math.max(0, remainSecs + d);
        if (remainSecs > totalSecs) totalSecs = remainSecs;
        if (remainSecs === 0) { finish(); showControls(); return; }
      }
      updateRunView(); showControls();
    }

    // 컨트롤은 평소 숨김 — 마우스·터치·키를 누르면 2.5초 보였다가 사라짐(멈춤·종료 상태에선 계속 보임)
    function showControls() {
      const rv = runView();
      rv.classList.add('ui');
      clearTimeout(uiTimer);
      if (running && remainSecs > 0) uiTimer = setTimeout(() => rv.classList.remove('ui'), 2500);
    }
    runView().addEventListener('mousemove', showControls);
    runView().addEventListener('touchstart', showControls, { passive: true });
    // 화면(버튼 밖)을 누르면 일시정지/계속
    runView().addEventListener('click', e => { if (!e.target.closest('.run-controls')) togglePause(); });
    document.addEventListener('keydown', e => {
      if (!runView().classList.contains('visible')) return;
      showControls();
      if (e.code === 'Space' && !e.target.closest('button')) { e.preventDefault(); togglePause(); }
      else if (e.code === 'KeyF') toggleFs();
    });

    function backToSetup() {
      clearInterval(interval); clearTimeout(uiTimer); running = false;
      runView().classList.remove('visible');
      document.getElementById('setupView').classList.remove('hidden');
    }

    function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    renderRecent();
  </script>
</body>
</html>
