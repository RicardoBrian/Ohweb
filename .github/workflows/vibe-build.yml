# 견본(kakainfo.com/vibe) 자동 갱신.
# 실제 앱(이 레포의 ohweb·ohinfo·ohlog·ohshrt, 다른 레포의 ohsettle(비공개)·gwansanattend·GWBS·GWVS·oHtravel·
# appinventorcheck·gwresearch)이 바뀌면 ohinfo/tools/vibe/build.py 로 견본을 다시 만들어 커밋한다.
# 다른 레포의 변경은 여기서 알 수 없으므로 하루 한 번도 돈다. 바뀐 게 없으면 커밋하지 않는다.
# build.py 가 실제 키·이메일이 남았는지 검사하고, 남아 있으면 실패해서 커밋하지 않는다.
name: vibe-build
on:
  workflow_dispatch:
  schedule:
    - cron: '41 18 * * *' # 매일 한국 시간 새벽 3시 41분
  push:
    branches: [main]
    paths:
      - 'ohweb/public/**'
      - 'ohinfo/public/**'
      - '!ohinfo/public/vibe/**'
      - 'ohlog/public/**'
      - 'ohshrt/public/**'
      - 'ohinfo/tools/vibe/**'
permissions:
  contents: write
concurrency: vibe-build
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 견본 만들기
        env:
          VIBE_READ_TOKEN: ${{ secrets.VIBE_READ_TOKEN }} # 비공개 저장소 ohsettle 읽기용
        run: VIBE_SRC=$RUNNER_TEMP/vibe-src python3 ohinfo/tools/vibe/build.py
      - name: 바뀌었으면 커밋
        run: |
          git add -A ohinfo/public/vibe
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git config user.name "vibe-build bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "vibe: 견본 자동 갱신"
          # comci-boot 봇이 같은 때 커밋했을 수 있으니 받아서 위에 얹는다
          git pull --rebase -q origin main
          git push
